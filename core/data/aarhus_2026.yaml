# ============================================================================
# Port of Aarhus 2026 — the eighth port silo (v0.6.0 Aarhus expansion)
#
# Authority of record: docs/sources/denmark/aarhus/
# AARHUS_EXTRACTION_REFERENCE.md (the per-port pattern; every figure below is
# transcribed from the eight archived documents with the citations carried).
#
# All amounts in DKK — the model's first non-EUR-non-SEK port. Conversions
# toward the SEK comparison basis run through the published-pairs machinery
# (the DKK pair in core/data/exchange_rates.yaml, added this pass), never a
# fixed ratio in code. The engine prices in DKK natively; currency local
# throughout.
#
# Mid-year vintage: the pilotage (§5.3) and mooring (§6.3) figures are the
# 1-July-2026 edition inside the 2026 ToC (the document's own cover states
# the update); the Danish-version precedence clause is recorded (the encoding
# works from the English edition with the clause noted).
#
# Billers: Port of Aarhus A/S (the authority layer — including pilotage: the
# port IS the pilotage provider and biller per Pilotage STC §1, in force
# 01.11.2022) and APM Terminals Aarhus A/S (the operator layer).
# ============================================================================
metadata:
  id: aarhus
  name: Port of Aarhus
  country: Denmark
  currency: DKK
  validity_start: "2026-01-01"
  validity_end: "2026-12-31"
  description: "Aarhus port call costs: the Port of Aarhus Terms and Conditions of Business 2026 (port dues, ESI discount, ISPS, working-environment levy, wharfage, pilotage — the port is the pilotage provider, mooring, towage — the port's own tugs HERMES and AROS), the APMT Aarhus terminal layer (the 1,105.00 DKK quay rate with the 140-unit minimum, gate, yard, reefer, VAS, storage, surcharges). Pilotage and mooring carry the 1-July-2026 mid-year vintage. The Danish ToC version prevails on discrepancy; the encoding works from the English edition with the clause noted."

billers:
  - id: port_of_aarhus
    name: Port of Aarhus A/S
    description: "The port authority and the pilotage provider (Pilotage STC §1: the port handles the public pilotage in Port of Aarhus and is legally obliged to deliver pilotage to all ships calling); the mooring line handlers' provider; the owner of the tugboats m.s. HERMES and AROS"
    currency: DKK
  - id: apm_terminals_aarhus
    name: APM Terminals Aarhus A/S
    description: "Terminal operator at Port of Aarhus (the container terminal); the published schedule is the default — written agreed rates prevail (ToB §2.1, the published-default honesty flag carried on the APMT lines)"
    currency: DKK

fee_rules:
  # ==========================================================================
  # THE AUTHORITY LAYER — Port of Aarhus Terms and Conditions of Business 2026
  # ==========================================================================
  - id: aarhus_port_due
    fee_family: port_dues
    biller: Port of Aarhus A/S
    name: Port Due (over 3,000 GT)
    description: "ToC §4.2: port due for ships over 3,000 GT — 4.00 DKK per GT up to 7 calendar days duration; supplement 0.70 DKK per GT per day beyond 7 calendar days (the extension rule below). The GT base is the tonnage certificate (SBT-deductible per the ToC's own definitions). The under-3,000-GT and under-150-m branches are recorded in the extraction reference, never encoded (the container-call scope)."
    rate_structure:
      type: per_unit
      unit_type: gt
      unit_rate: 4.00
    adjustments:
      - type: discount
        percentage: 4.5
        condition: "esi_score >= 30"
        description: "Environmental discount (ToC §4.3): ships achieving a minimum ESI score of 30 points are awarded a 4.5% discount on the port due, based on GT (registration per the ESI regulations; cruise ships exempt — out of scope)"
        stack_method: additive
        stacking_order: 1
    source_reference:
      document_name: "Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_url: "docs/sources/denmark/aarhus/port-of-aarhus/Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_issued: "2026-01-01"
      page: "§4.2–4.3"
      clause: "4.2; 4.3"
      verified_on: "2026-10-06"
      verified_by: "vibe-session-aarhus-expansion"
  - id: aarhus_port_due_extension
    fee_family: port_dues
    biller: Port of Aarhus A/S
    name: Port Due Extension (beyond 7 calendar days)
    description: "ToC §4.2: supplement for over 7 calendar days duration — 0.70 DKK per GT per commenced day beyond the seventh. Falls back to lay time (the default 50 h carries no extension)."
    rate_structure:
      type: per_commenced_period
      basis: gt
      hours_input: port_time_hours
      fallback_hours: lay_time_hours
      free_hours: 168
      period_hours: 24
      tiers:
        - up_to_excess_hours: null
          rate_per_period_per_basis: 0.70
    source_reference:
      document_name: "Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_url: "docs/sources/denmark/aarhus/port-of-aarhus/Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_issued: "2026-01-01"
      page: "§4.2"
      clause: "4.2"
      verified_on: "2026-10-06"
      verified_by: "vibe-session-aarhus-expansion"
  - id: aarhus_pilotage
    fee_family: pilotage
    biller: Port of Aarhus A/S
    name: Pilotage (the port's own service; the July-2026 edition)
    description: "ToC §5.3 (prices updated as of 1 July 2026 — the mid-year vintage): pilotage per call by GT band of the ship assisted. The Port of Aarhus IS the pilotage provider and biller (Pilotage STC §1, in force 01.11.2022: 'Port of Aarhus handles the public pilotage in Port of Aarhus'; the port is under Danish law obliged to deliver pilotage to all ships calling) — the bands encode directly as the port's own prices. Waiting time 1,170 DKK per commenced hour beyond 30 minutes (recorded); cancellation 595 DKK (recorded)."
    rate_structure:
      type: banded_flat
      basis: gt
      bands:
        - min: null
          max: 3000
          amount: 4995.00
        - min: 3000
          max: 4500
          amount: 6355.00
        - min: 4500
          max: 6000
          amount: 10325.00
        - min: 6000
          max: 10000
          amount: 11525.00
        - min: 10000
          max: 20000
          amount: 14495.00
        - min: 20000
          max: null
          amount: 18565.00
    source_reference:
      document_name: "Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_url: "docs/sources/denmark/aarhus/port-of-aarhus/Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_issued: "2026-07-01"
      page: "§5.3"
      clause: "5.3 (updated 1 July 2026)"
      verified_on: "2026-10-06"
      verified_by: "vibe-session-aarhus-expansion"
  - id: aarhus_mooring
    fee_family: mooring
    biller: Port of Aarhus A/S
    name: Mooring (mandatory approved line handlers over 80 m LOA; the July-2026 edition)
    description: "ToC §6.1/§6.3 (prices updated as of 1 July 2026): all ships exceeding 80 meters LOA and calling at a quay must use one or more approved line handlers (mandatory; provided by the Port of Aarhus or an externally approved supplier). Price per mooring by GT band of the ship assisted — the model's first priced mooring, an authority service (published band price, never an estimate). Waiting time at departure 1,175 DKK per commenced hour beyond 30 min (recorded); boat assistance 4,450 DKK/h (recorded); cancellation 595 DKK (recorded). Shifting along the quay may be crew-handled (recorded)."
    rate_structure:
      type: banded_flat
      basis: gt
      bands:
        - min: null
          max: 2000
          amount: 695.00
        - min: 2000
          max: 3000
          amount: 1010.00
        - min: 3000
          max: 4500
          amount: 1295.00
        - min: 4500
          max: 6000
          amount: 2525.00
        - min: 6000
          max: 10000
          amount: 3350.00
        - min: 10000
          max: 20000
          amount: 3795.00
        - min: 20000
          max: null
          amount: 6200.00
    source_reference:
      document_name: "Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_url: "docs/sources/denmark/aarhus/port-of-aarhus/Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_issued: "2026-07-01"
      page: "§6.1, §6.3"
      clause: "6.1 (mandatory over 80 m LOA); 6.3 (updated 1 July 2026)"
      verified_on: "2026-10-06"
      verified_by: "vibe-session-aarhus-expansion"
  - id: aarhus_towage
    fee_family: towage
    biller: Port of Aarhus A/S
    name: Towage (the port's own tugs — published bands, per-port honest)
    description: "ToC §7.4: price per tugboat by GT band of the assisted ship — the port's own tugboats m.s. HERMES (5,400 hp, 66.5 t bollard pull) and AROS (4,750 hp, 55 t bollard pull); the Scandinavian Tugowners Standard Conditions of 1985 govern (archived). The published band replaces the estimated-parameter convention AT AARHUS ONLY — the band prices one tugboat; the call's tug count keys the total (the same LOA-class default the estimate convention uses: LOA < 150 m: 0 tugs; 150–250 m: 1; > 250 m: 2, user-overridable). The estimate convention is unchanged at every other port. Hourly rate 7,050 DKK (recorded); waiting 5,875 DKK/h beyond 30 min (recorded); cancellation 3,525 DKK (recorded); 50% surcharge for towing without main engines and 50% reduction for shifting (recorded)."
    rate_structure:
      type: per_unit
      unit_type: tug_count
      unit_rate: 0
      banded_by_gt:
        bands:
          - min: null
            max: 10000
            amount: 18500.00
          - min: 10000
            max: 20000
            amount: 24700.00
          - min: 20000
            max: 50000
            amount: 40500.00
          - min: 50000
            max: null
            amount: 81000.00
      default_by_loa:
        bands:
        - max_m: 150
          count: 0
          description: 'LOA < 150 m: 0 tugs'
        - min_m: 150
          max_m: 250
          count: 1
          description: '150-250 m: 1 tug'
        - min_m: 250
          count: 2
          description: '> 250 m: 2 tugs'
    source_reference:
      document_name: "Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_url: "docs/sources/denmark/aarhus/port-of-aarhus/Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_issued: "2026-01-01"
      page: "§7.4"
      clause: "7.4 (the tugs HERMES and AROS; the Scandinavian Tugowners Standard Conditions of 1985 govern)"
      verified_on: "2026-10-06"
      verified_by: "vibe-session-aarhus-expansion"
  - id: aarhus_isps
    fee_family: security
    biller: Port of Aarhus A/S
    name: ISPS Fee (per loaded container)
    description: "ToC §3.3: the Port of Aarhus charges a separate ISPS fee of 9.65 DKK per loaded container (also per self-propelled unit and wind turbine blade — out of the container scope). The 0.25 DKK/ton surface for goods at ISPS-secured quays is recorded in the extraction reference (the per-container line prices the container call); transit goods: the incoming leg only (recorded)."
    rate_structure:
      type: per_unit
      unit_type: move
      unit_rate: 9.65
    source_reference:
      document_name: "Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_url: "docs/sources/denmark/aarhus/port-of-aarhus/Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_issued: "2026-01-01"
      page: "§3.3"
      clause: "3.3"
      verified_on: "2026-10-06"
      verified_by: "vibe-session-aarhus-expansion"
  - id: aarhus_work_environment_levy
    fee_family: security
    biller: Port of Aarhus A/S
    name: Working-Environment Levy (per container)
    description: "ToC §8.1: per the Ministry of Labour's regulation no. 181 of 18 May 1965 (welfare facilities for dockworkers), the work-environment levy is 5.90 DKK per container and self-propelled unit loaded or unloaded over the quay (0.59 DKK per ton of dry bulk and general cargo — out of the container scope). Charged by the Port of Aarhus to the ship's local agent or customer."
    rate_structure:
      type: per_unit
      unit_type: container_total
      unit_rate: 5.90
    source_reference:
      document_name: "Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_url: "docs/sources/denmark/aarhus/port-of-aarhus/Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_issued: "2026-01-01"
      page: "§8.1"
      clause: "8.1"
      verified_on: "2026-10-06"
      verified_by: "vibe-session-aarhus-expansion"
  - id: aarhus_wharfage
    fee_family: cargo_fee
    biller: Port of Aarhus A/S
    name: Wharfage (cargo side, per loaded container)
    description: "ToC §8: wharfage is paid to the Port of Aarhus for all goods unloaded, loaded, or otherwise discharged by sea or land — 225 DKK per container with goods; empty containers 0. Payment of the wharfage is the responsibility of the recipient or sender of the goods — the CARGO SIDE (the GOT/HEL cargo-side analogue; rendered and attributed, never silently dropped). Ro-ro 210 DKK/unit, wind-turbine blades 485 DKK/unit, passenger fees — out of the container scope (recorded)."
    rate_structure:
      type: per_unit
      unit_type: move
      unit_rate: 225.00
    source_reference:
      document_name: "Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_url: "docs/sources/denmark/aarhus/port-of-aarhus/Port of Aarhus - Terms and Conditions of Business 2026.pdf"
      document_issued: "2026-01-01"
      page: "§8"
      clause: "8"
      verified_on: "2026-10-06"
      verified_by: "vibe-session-aarhus-expansion"
  # ==========================================================================
  # THE OPERATOR LAYER — APMT Aarhus (the 2026 tariff; ToB published-default
  # honesty flag carried on every APMT line)
  # ==========================================================================
  - id: apmt_aarhus_container_handling
    fee_family: terminal_handling
    biller: APM Terminals Aarhus A/S
    name: Container Handling (quay operations)
    description: "APMT Aarhus 2026 tariff §2.1: 1,105.00 DKK per container (full or empty), load or discharge move. Basis wording verbatim: 'The rate is based on continuous work from the start-up times and do not include lashing/unlashing of containers.' Minimum payment: 140 units per call — the default 4,000-move call exceeds it by 3,860; the minimum is encoded as the rule's floor (140 x 1,105.00 = 154,700.00 DKK) and never fires at the default (pinned)."
    rate_structure:
      type: per_unit
      unit_type: move
      unit_rate: 1105.00
    minimum: 154700
    contract_vs_published:
      description: "Published-default schedule (APMT Terms of Business §2.1, 14 Jan 2026 V20): the rates are the rates agreed in writing between the Parties or, where no such rates have been agreed, the rates listed on the website — contract rates may differ from the published schedule; the published-default honesty flag"
      severity: warning
    source_reference:
      document_name: "Aarhus-01_01_2026-31_12_2026-Tariff - 2026.pdf"
      document_url: "docs/sources/denmark/aarhus/apmt/Aarhus-01_01_2026-31_12_2026-Tariff - 2026.pdf"
      document_issued: "2026-01-01"
      page: "§2.1"
      clause: "2.1 (minimum payment: 140 unit per call)"
      verified_on: "2026-10-06"
      verified_by: "vibe-session-aarhus-expansion"
  - id: apmt_aarhus_lashing
    fee_family: cargo_fee
    biller: APM Terminals Aarhus A/S
    name: Lashing / Unlashing (gang-hour based)
    description: "APMT Aarhus 2026 tariff §2.5: lashing per gang (2 persons) per hour — 2,251.00 DKK weekday 1st shift (07:00-16:00), 2,786.00 2nd shift, 3,545.00 all other times; minimum payment 4 hours. Ordered service — fires only when a lashing container count is entered; blank charges zero, never a seeded count. The shift schedule is a recorded surface (the weekday 1st-shift rate prices the entered count)."
    rate_structure:
      type: per_unit
      unit_type: lashing_containers
      unit_rate: 2251.00
    contract_vs_published:
      description: "Published-default schedule (APMT Terms of Business §2.1, 14 Jan 2026 V20): written agreed rates prevail over the published schedule; the published-default honesty flag"
      severity: warning
    source_reference:
