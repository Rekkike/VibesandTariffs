    name: Reefer Daily Monitoring
    description: "APMT Aarhus 2026 tariff §7.1: monitoring/daily running charge 380.00 DKK per container per day. Fires only with reefer units and reefer days; blank charges zero. The RDEC variable energy charge (§7.2) rides the actual-consumption basis — recorded, never default-fired."
    rate_structure:
