    biller: APM Terminals Aarhus A/S
    name: Gate Move (truck)
    description: "APMT Aarhus 2026 tariff §4.1: 338.00 DKK per container, full or empty, including the horizontal move from truck to yard/stack or vice versa; based on delivery on weekdays Mon-Thu 06:00-18:00, Fri 06:00-17:00 (the gate access surcharge 100 DKK/container Mon-Thu 18:00-19:00 is a recorded surface). The landside leg — the comparison view's container-through toggle surface (the BRV/Eurogate precedent); blank charges zero."
