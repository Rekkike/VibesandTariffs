# Port of Gävle 2026 Hamntaxa
# Complete data file for Port Call Cost Analyzer - self-contained port silo
# (spec: each port file is independently verifiable with zero references to any
# other port file; the engine and fee-family vocabulary are the only shared assets)
#
# All amounts in SEK, ex-VAT. Authority of record:
# docs/sources/sweden/gavle/GAVLE_EXTRACTION_REFERENCE.md;
# tariff PDFs archived at docs/sources/sweden/gavle/hamntaxa-2026.pdf
# (SHA-256 793b43ad0750ddd057304aa2be8025eecd3f723b5b365799eddcc9e41f2b0d68,
# fetched 2026-10-02; the tariff's own reservation clause - the right to
# revise during the year - makes the checksum the vintage pin) and at
# docs/sources/sweden/gavle/yilport-container-terminal-tariff-2026.pdf
# (SHA-256 c80d0c673e1821b487cb1d1b42a457a39046089fd9dbe651cf853ce396e5d014,
# fetched 2026-10-01; the operator layer, source S2 of the same reference).
#
# Not modeled (reference sections 9 and 11; the v0.4.2 re-baseline: the
# container terminal handling and container cargo due gap notices are
# superseded by the Yilport operator rules gvh_yilport_handling_full /
# gvh_yilport_cargo_due - the v0.4.0 gaps close with the archived 2026
# operator tariff; the Yilport operational surfaces - overtime gangs,
# out-of-window surcharge, waiting time, COPRAR-absence fee, the
# productivity-compensation credit, the empty-container throughput rate,
# section 6 additional services, reefer plug/monitoring, the re-nomination
# fee, the incremental rebate - are recorded in the extraction reference
# section 11.5, never encoded: their conditions are not call inputs):
# bulk/liquid commodity cargo dues - out of scope for the container model;
# rail, truck weighing, pass cards - land-side;
# scrubber waste actual cost + 500 SEK admin - actual-cost basis, not a
# published rate;
# LNG 20% miljörabatt - the model's call input surface carries no LNG-fuel
# attestation; recorded in the dues rule's description, never silently applied;
# the winter +100% surcharge (1 December - 30 April) - a date-window condition
# the engine does not support (a genuinely new rule shape, reported); surfaced
# as a limitation notice, the base rate priced year-round.

metadata:
  id: gavle
  name: Port of Gävle
  country: Sweden
  currency: SEK
  validity_start: '2026-01-01'
  validity_end: '2026-12-31'
  description: 'Gävle Hamn AB acts as port authority (hamnavgift, miljötillägg, varuhamnsavgift outside the Yilport concession); Yilport Gävle operates the container terminal under concession with its own archived 2026 tariff (encoded since v0.4.2); Sjöfartsverket levies national fairway and pilotage fees. Source: Hamntaxa Gävle Hamn 2026 (S1, effective 1 January 2026); Yilport Gävle Container Terminal General Tariff 2026 (S2).'
  document_url: https://gavlehamn.se/wp-content/uploads/2025/11/Hamntaxa-Gavle-Hamn-2026.pdf

billers:
  - id: gavle_hamn_ab
    name: Gävle Hamn AB
    description: 'Gävle Hamn AB: hamnavgift per vessel type and terminal, miljötillägg (waste), varuhamnsavgift (outside the Yilport concession and not-over-quay goods), liggetidsavgift, electricity connection'
    currency: SEK
  - id: sjofartsverket
    name: Sjöfartsverket
    description: 'Swedish Maritime Administration: national vessel fee (fartygsavgift), readiness fee (beredskapsavgift), cargo fee (godsavgift), pilotage (lotsavgift), ordering fee'
    currency: SEK
    frequency_discount:
      id: gavle_sfv_frequency_discount
      name: Frequency Discount - Vessel Fee and Readiness Fee
      fee_family: frequency_discount
      apply_families: [vessel_fee, readiness_fee]
      bands:
        - min_calls: 1
          max_calls: 2
          payable_pct: 100
        - min_calls: 3
          max_calls: 3
          payable_pct: 75
        - min_calls: 4
          max_calls: 4
          payable_pct: 50
        - min_calls: 5
          max_calls: 5
          payable_pct: 25
        - min_calls: 6
          max_calls: null
          payable_pct: 0
      source_reference:
        document_name: prislista-farleds-lotsavgifter-2026.pdf
        document_url: docs/sources/sweden/national/sjofartsverket/prislista-farleds-lotsavgifter-2026.pdf
        upstream_url: "https://www-n.sjofartsverket.se/globalassets/tjanster/anlopstjanster/sjofartsverkets-farleds--och-lotsavgifter/prislista-farleds--och-lotsavgifter-2026.pdf"
        page: 4
        clause: Frequency discount
        verified_on: '2026-10-02'
        verified_by: vibe-session-swedish-expansion
        document_issued: '2025-11-01'
  - id: yilport_gavle
    name: Yilport Gävle (container terminal)
    description: 'Container-terminal operator inside the concession area; Yilport Gävle Container Terminal General Tariff, 2026 Tariff Rates (valid 1 January - 31 December 2026, SEK ex-VAT, Ports of Sweden General Conditions 1989) - archived 2026-10-01, the operator layer of this silo (the v0.4.2 terminal-layer pass)'
    currency: SEK
  - id: towage_provider
    name: Towage operator (estimated)
    description: 'Commercial tug services; no published Gävle tug tariff - estimated parameter'
    currency: SEK

fee_rules:
  # --- Hamnavgift: container terminal vessels (S1 §2.1, p.4) ---
  - id: gvh_hamnavgift_container
    fee_family: port_dues
    biller: Gävle Hamn AB
    name: Hamnavgift - Containerfartyg
    description: 'Hamnavgift (port dues) for container vessels calling the Bulkterminal / Containerterminal / Granudden: 2.97 SEK/GT. Miljörabatt: ESI >= 30 points or CSI >= 4 stars gives 10% off the GT-based vessel fee (registration reported in MSW before the call). LNG fuel at the call gives a further 20% off - the model''s input surface carries no LNG-fuel attestation, so the LNG discount is recorded here, never silently applied; where both would apply the conservative default prices the highest single discount (the tariff does not state a stacking rule - extraction reference section 10.1). Winter surcharge: 1 December - 30 April +100% - a date-window condition the engine does not support (a genuinely new rule shape, reported); the limitation notice below documents it and the base rate is priced year-round.'
    rate_structure:
      type: per_unit
      unit_type: gt
      unit_rate: 2.97
    source_reference:
      document_name: hamntaxa-2026.pdf
      document_url: docs/sources/sweden/gavle/hamntaxa-2026.pdf
      page: 4
      clause: '2.1 Fartyg till Bulkterminal, Containerterminal och Granudden - Containerfartyg SEK 2,97/GT'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-01-01'
    adjustments:
      - type: discount
        percentage: 10
        condition: "esi_score >= 30"
        stack_method: multiplicative
        stacking_order: 1
        description: 'Miljörabatt (section 3): vessels with at least 30 ESI points receive 10% off the GT-based vessel fee; registration must be reported in Maritime Single Window before the call. The alternative key - at least 4 CSI STARS (the Clean Shipping Index star rating, a different scale from both Sjöfartsverket''s A-E class and the model''s 1-5 CSI-class input) - is recorded here, never conflated: the model keys the discount on the ESI score only.'

  # --- Winter surcharge limitation notice (the date-window finding) ---
  - id: gvh_winter_surcharge_notice
    fee_family: port_dues
    biller: Gävle Hamn AB
    name: Winter Surcharge 1 Dec - 30 Apr +100% (limitation notice)
    description: 'The tariff doubles the vessel dues from 1 December to 30 April ("Istillägg 1 december till 30 april +100%"). A date-window condition on the call date is a rule shape the engine does not support - pricing it would require new machinery (a calendar-window condition type), which this pass does not improvise. The model prices the base rate year-round; a call within the window in reality doubles the hamnavgift. This notice documents the limitation; nothing is added to any total.'
    rate_structure:
      type: flat
      amount: 0
    service_gap_notice:
      description: 'Winter surcharge: the tariff''s +100% istillägg applies 1 December - 30 April; the model cannot price a calendar-window condition (a new rule shape, reported as a finding) and prices the base rate year-round. A call inside the window underprices the hamnavgift by 100% - the user must apply the doubling manually for winter calls.'
      severity: warning
    source_reference:
      document_name: hamntaxa-2026.pdf
      document_url: docs/sources/sweden/gavle/hamntaxa-2026.pdf
      page: 4
      clause: '2.1 Istillägg 1 december till 30 april +100% (enligt ovanstående taxa)'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-01-01'

  # --- Liggetidsavgift (S1 §2.6, p.5) ---
  - id: gvh_liggetidsavgift
    fee_family: port_dues
    biller: Gävle Hamn AB
    name: Liggetidsavgift (Lay-Time Fee)
    description: 'Liggetidsavgift 62 SEK per metre LOA per commenced day, charged for vessels arriving earlier than needed to start cargo or remaining after completion beyond routine departure preparations. Priced from the shared lay-up/idle-days input (default 0 - the default call prices no idle stay).'
    rate_structure:
      type: per_commenced_day
      daily_rate: 62
      basis: loa_m
    source_reference:
      document_name: hamntaxa-2026.pdf
      document_url: docs/sources/sweden/gavle/hamntaxa-2026.pdf
      page: 5
      clause: '2.6 Liggetidsavgift - Per meter av LOA, per påbörjat dygn SEK 62/meter'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-01-01'

  # --- Miljötillägg: waste (S1 §4.1, p.6) ---
  - id: gvh_miljotillagg_container
    fee_family: waste
    biller: Gävle Hamn AB
    name: Miljötillägg (Waste) - Containerfartyg
    description: 'Waste-reception charge (miljötillägg) in accordance with Swedish legislation and EU directive 2000/59/EG, covering normal quantities (sludge, oily bilge water, solid waste). Containerfartyg rate: 0.18 SEK/GT. Additional quantities beyond normal are billed specially (section 4.1/4.2 conditions); scrubber waste, cargo residues and non-ship waste at actual cost plus 500 SEK administration fee (actual-cost basis, no published per-unit rate).'
    rate_structure:
      type: per_unit
      unit_type: gt
      unit_rate: 0.18
    source_reference:
      document_name: hamntaxa-2026.pdf
      document_url: docs/sources/sweden/gavle/hamntaxa-2026.pdf
      page: 6
      clause: '4.1 Sludge, oljehaltigt länsvatten och fast avfall - Containerfartyg SEK 0,18/GT'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-01-01'

  # --- Electricity connection (S1 §2.4, p.4) ---
  - id: gvh_electricity_connection
    fee_family: connection_fee
    biller: Gävle Hamn AB
    name: OPS Electricity Connection Fee
    description: 'Avgift för elanslutning (shore-power connection): 5,145 SEK per call; "Rörlig elförbrukning faktisk kostnad" - consumption at actual cost (the user''s own kWh figure and price, never a tariff-derived amount). Priced when OPS usage is attested.'
    rate_structure:
      type: flat
      amount: 5145
    applicable_conditions:
      ops_usage: true
    source_reference:
      document_name: hamntaxa-2026.pdf
      document_url: docs/sources/sweden/gavle/hamntaxa-2026.pdf
      page: 4
      clause: '2.4 Avgift för elanslutning - Anslutningsavgift SEK 5 145/anlöp; Rörlig elförbrukning faktisk kostnad'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-01-01'

  # --- Yilport terminal layer (S2 sections 4/5, the v0.4.2 terminal-layer pass;
  # replaces the v0.4.0 terminal-handling gap notice with its verified rule) ---
  - id: gvh_yilport_handling_full
    fee_family: terminal_handling
    biller: Yilport Gävle (container terminal)
    name: Container Throughput Rate - Full Container
    description: 'Yilport Gävle throughput rate, full container: 1,679 SEK per unit. Bundled basis (S2 section 4.1 verbatim): "Includes lift off vessel, train or truck into terminal and lift to vessel, train or truck out of terminal. Hatch covers and twist-lock handling is included" - one rate both directions, the through figure. The empty-container rate (1,235 SEK per unit, section 4.2, the same bundled basis) is recorded, not encoded: the call model carries no empty-unit count input (extraction reference section 11.6).'
    rate_structure:
      type: per_unit
      unit_type: container_total
      unit_rate: 1679
    source_reference:
      document_name: yilport-container-terminal-tariff-2026.pdf
      document_url: docs/sources/sweden/gavle/yilport-container-terminal-tariff-2026.pdf
      upstream_url: "https://yilport.com/en/images/PartDocuments/2026_yilport_ga_vle_container_terminal_general_tariff.pdf"
      page: 3
      clause: '4.1 Full container SEK 1 679 (Includes lift off vessel, train or truck into terminal and lift to vessel, train or truck out of terminal. Hatch covers and twist-lock handling is included)'
      verified_on: '2026-10-01'
      verified_by: vibe-session-terminal-basis
      document_issued: '2026-01-01'
  - id: gvh_yilport_oog_surcharge
    fee_family: terminal_handling
    biller: Yilport Gävle (container terminal)
    name: OOG Container Throughput Surcharge
    description: 'Yilport Gävle out-of-gauge throughput: "additional 100% of the above rates" (S2 section 4.3) - each OOG unit prices the full-container throughput rate again on top of the base throughput. Blank OOG count = no OOG units, charges zero.'
    rate_structure:
      type: per_unit
      unit_type: oog
      unit_rate: 1679
    source_reference:
      document_name: yilport-container-terminal-tariff-2026.pdf
      document_url: docs/sources/sweden/gavle/yilport-container-terminal-tariff-2026.pdf
      upstream_url: "https://yilport.com/en/images/PartDocuments/2026_yilport_ga_vle_container_terminal_general_tariff.pdf"
      page: 3
      clause: '4.3 OOG Containers - additional 100% of the above rates'
      verified_on: '2026-10-01'
      verified_by: vibe-session-terminal-basis
      document_issued: '2026-01-01'
  # --- Yilport cargo due and ISPS (S2 section 5; the cargo-due side replaces
  # the v0.4.0 container-cargo-due gap notice with its verified operator rule) ---
  - id: gvh_yilport_cargo_due
    fee_family: port_dues
    biller: Yilport Gävle (container terminal)
    name: Cargo Due (per full container)
    description: 'Yilport Gävle cargo due: 482 SEK per full container (S2 section 5.1). The port-authority varuhamnsavgift table publishes no container rate (its scope is outside the Yilport concession); the operator''s cargo due is the container cargo-side figure at this port - the v0.4.0 gap notice is superseded by this verified rule (re-baselined with attribution, the v0.4.2 pass).'
    rate_structure:
      type: per_unit
      unit_type: container_total
      unit_rate: 482
    source_reference:
      document_name: yilport-container-terminal-tariff-2026.pdf
      document_url: docs/sources/sweden/gavle/yilport-container-terminal-tariff-2026.pdf
      upstream_url: "https://yilport.com/en/images/PartDocuments/2026_yilport_ga_vle_container_terminal_general_tariff.pdf"
      page: 3
      clause: '5.1 Cargo Due (per full container) SEK 482'
      verified_on: '2026-10-01'
      verified_by: vibe-session-terminal-basis
      document_issued: '2026-01-01'
  - id: gvh_yilport_isps
    fee_family: security
    biller: Yilport Gävle (container terminal)
    name: ISPS (per full container)
    description: 'Yilport Gävle ISPS: 73 SEK per full container (S2 section 5.2).'
    rate_structure:
      type: per_unit
      unit_type: container_total
      unit_rate: 73
    source_reference:
      document_name: yilport-container-terminal-tariff-2026.pdf
      document_url: docs/sources/sweden/gavle/yilport-container-terminal-tariff-2026.pdf
      upstream_url: "https://yilport.com/en/images/PartDocuments/2026_yilport_ga_vle_container_terminal_general_tariff.pdf"
      page: 3
      clause: '5.2 ISPS (per full container) SEK 73'
      verified_on: '2026-10-01'
      verified_by: vibe-session-terminal-basis
      document_issued: '2026-01-01'
  - id: gvh_yilport_imdg_reefer
    fee_family: dangerous_goods
    biller: Yilport Gävle (container terminal)
    name: IMDG / Reefer Surcharge (per unit)
    description: 'Yilport Gävle IMDG / Reefer surcharge: 401 SEK per unit (S2 section 5.3), keyed on the reefer-unit count; the same per-unit rate applies to IMDG units via the companion rule below. Blank counts = no units, charges zero.'
    rate_structure:
      type: per_unit
      unit_type: reefer
      unit_rate: 401
    source_reference:
      document_name: yilport-container-terminal-tariff-2026.pdf
      document_url: docs/sources/sweden/gavle/yilport-container-terminal-tariff-2026.pdf
      upstream_url: "https://yilport.com/en/images/PartDocuments/2026_yilport_ga_vle_container_terminal_general_tariff.pdf"
      page: 3
      clause: '5.3 IMDG / Reefer Surcharge (per unit) SEK 401'
      verified_on: '2026-10-01'
      verified_by: vibe-session-terminal-basis
      document_issued: '2026-01-01'
  - id: gvh_yilport_imdg_dangerous
    fee_family: dangerous_goods
    biller: Yilport Gävle (container terminal)
    name: IMDG / Reefer Surcharge - IMDG Units (per unit)
    description: 'The IMDG-unit share of the Yilport Gävle IMDG / Reefer surcharge: the same 401 SEK per unit (S2 section 5.3) keyed on the dangerous-goods unit count. Blank count = no units, charges zero.'
    rate_structure:
      type: per_unit
      unit_type: dangerous_goods
      unit_rate: 401
    source_reference:
      document_name: yilport-container-terminal-tariff-2026.pdf
      document_url: docs/sources/sweden/gavle/yilport-container-terminal-tariff-2026.pdf
      upstream_url: "https://yilport.com/en/images/PartDocuments/2026_yilport_ga_vle_container_terminal_general_tariff.pdf"
      page: 3
      clause: '5.3 IMDG / Reefer Surcharge (per unit) SEK 401'
      verified_on: '2026-10-01'
      verified_by: vibe-session-terminal-basis
      document_issued: '2026-01-01'
  # --- Yilport storage (S2 section 7, scenario surface; zero-storage-default holds) ---
  - id: gvh_yilport_storage_full_20ft
    fee_family: storage
    biller: Yilport Gävle (container terminal)
    name: Storage - Full Containers 20ft (scenario)
    description: 'Yilport Gävle storage of full containers, per TEU per day: 7 calendar days free ("Arrival and departure days will be calculated"), 8+ days at 135 SEK per TEU per day (S2 section 7.1). TEU basis per S2 section 1.3: units over 20'' to 40'' count 2 TEU; 45'' containers 2.25 TEU (no 45'' bucket or count input exists - the established two-bucket convention prices <=20'' as 1 TEU and >20'' as 2 TEU; the 45'' refinement is recorded here with its citation, never a re-profiled call). The tariff''s empty-container rate ("SEK 13,46", the Swedish decimal comma, read 13.46 per TEU per day, no free time stated) and the OOG +100% storage uplift are recorded in the extraction reference, not encoded (no empty-unit input; OOG storage has no day input of its own). Scenario surface - fires only when storage days are entered beyond the free time; blank renders no line (the zero-storage-default convention, spec v0.4.1).'
    rate_structure:
      type: progressive_daily
      days_input: storage_days_import
      container_count_input: containers_discharged_le20ft
      free_days: 7
      bands:
        - min_days: 1
          max_days: null
          rate_per_container_per_day: 135
    scenario_adjusted:
      description: 'scenario-derived figure - the storage-day count is the user''s scenario input over the pinned tariff schedule; never tariff-transcribed usage'
      severity: info
    source_reference:
      document_name: yilport-container-terminal-tariff-2026.pdf
      document_url: docs/sources/sweden/gavle/yilport-container-terminal-tariff-2026.pdf
      upstream_url: "https://yilport.com/en/images/PartDocuments/2026_yilport_ga_vle_container_terminal_general_tariff.pdf"
      page: 4
      clause: '7. Storage (per TEU per Day) - 7.1 Full Containers: Free Time 7 calendar days; 8+ days SEK 135'
      verified_on: '2026-10-01'
      verified_by: vibe-session-terminal-basis
      document_issued: '2026-01-01'
  - id: gvh_yilport_storage_full_40ft
    fee_family: storage
    biller: Yilport Gävle (container terminal)
    name: Storage - Full Containers 40ft (scenario)
    description: 'Yilport Gävle storage of full containers, the >20ft bucket at its 2-TEU share: 7 calendar days free, 8+ days at 135 SEK per TEU per day (S2 section 7.1; each >20ft unit counts 2 TEU per section 1.3, so the per-unit day rate is 270). Scenario surface - fires only when storage days are entered beyond the free time; blank renders no line.'
    rate_structure:
      type: progressive_daily
      days_input: storage_days_import
      container_count_input: containers_discharged_gt20ft
      free_days: 7
      bands:
        - min_days: 1
          max_days: null
          rate_per_container_per_day: 270
    scenario_adjusted:
      description: 'scenario-derived figure - the storage-day count is the user''s scenario input over the pinned tariff schedule; never tariff-transcribed usage'
      severity: info
    source_reference:
      document_name: yilport-container-terminal-tariff-2026.pdf
      document_url: docs/sources/sweden/gavle/yilport-container-terminal-tariff-2026.pdf
      upstream_url: "https://yilport.com/en/images/PartDocuments/2026_yilport_ga_vle_container_terminal_general_tariff.pdf"
      page: 4
      clause: '7. Storage (per TEU per Day) - 7.1 Full Containers: 8+ days SEK 135 per TEU (2 TEU per >20ft unit, section 1.3)'
      verified_on: '2026-10-01'
      verified_by: vibe-session-terminal-basis
      document_issued: '2026-01-01'

  # --- Towage (estimated; no published Gävle tug tariff) ---
  - id: gvh_towage_estimate
    fee_family: towage
    biller: Towage operator (estimated)
    name: Towage (estimated)
    description: 'Towage per tug-assist. No published Gävle tug tariff found in the hamntaxa; declared estimate 60,000 SEK per tug-assist; user-editable. Default tug count by LOA class (spec 3.3, defaults are data, user-overridable): LOA < 150 m: 0 tugs; 150-250 m: 1; > 250 m: 2.'
    rate_structure:
      type: per_unit
      unit_type: tug_count
      unit_rate: 60000
      unit_rate_input: towage_cost_per_tug
      default_by_loa:
        bands:
          - max_m: 150
            count: 0
            description: 'LOA < 150 m: 0 tugs'
          - min_m: 150
            max_m: 250
            count: 1
            description: '150-250 m: 1 tug'
          - min_m: 250
            count: 2
            description: '> 250 m: 2 tugs'
    source_reference:
      document_name: GAVLE_EXTRACTION_REFERENCE.md
      document_url: docs/sources/sweden/gavle/GAVLE_EXTRACTION_REFERENCE.md
      page: 5
      clause: 5 - Estimated parameters
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-10-02'
    estimated_parameter:
      description: 'estimated; no published Gävle tug tariff; default 60,000 SEK per tug-assist, tug-count defaults by LOA class'
      severity: info
  # ==========================================================================
  # SJÖFARTSVERKET NATIONAL FEES (Swedish Maritime Administration)
  # All based on Net Tonnage (NT); Gävle silo transcription of the national rules (the port-silo discipline: every port file carries its own rules with its own citations).
  # ==========================================================================

  - id: gvh_sfv_vessel_fee_class1_csi_a
    fee_family: vessel_fee
    biller: Sjöfartsverket
    name: Vessel Fee - Class 1, CSI Class A
    description: Fartygsavgift (national vessel fee) for NT class 1 (0+ NT), Sjöfartsverket environmental class A.
    rate_structure:
      type: flat
      amount: 735
    source_reference:
