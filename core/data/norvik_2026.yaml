  # --- Storage (S2 p.7) - the scenario surface (Eurogate ch. 7 pattern) ---
  # Loaded storage import/export: days 1-5 free, 6-7 at 91 kr/TEU/day,
  # day 8 and above at 343 kr/TEU/day. TEU basis applied per size bucket
  # (20' = 1 TEU, 40'/45' = 2 TEU): the per-size rates are the tariff's own
  # TEU figures converted at the bucket level, disclosed in each description.
  # Storage days are the user's scenario input; the default is zero days
