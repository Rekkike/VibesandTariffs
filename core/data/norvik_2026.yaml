    currency: SEK

fee_rules:
  # ============ PORTS OF STOCKHOLM (port-authority layer, S1) ============
  # --- Vessel dues (S1 section 3.1, p.7) ---
  - id: snv_pos_vessel_dues
    fee_family: port_dues
    biller: Ports of Stockholm (Stockholms Hamnar)
    name: Vessel Dues (Basic Fee)
    description: 'Vessel dues basic fee 5.17 SEK/GT, minimum 2,585 SEK per call, calculated on GT per Lloyd''s Register 1969 measurement on a minimum of 500 GT. The reduced 4.65 SEK/GT rate applies only when calling a quay not belonging to Ports of Stockholm or when exempted from waste delivery - neither is the Norvik container call; recorded, never a default. Environmental rebates (section 3.4) are per-GT rebates on this basic fee, banded on ESI points (the CSI-points alternative is the vessel owner''s choice of index; the model''s ESI input keys the bands, the CSI alternative is recorded here); the maximum rebate may never exceed 10 percent of the port fees - the deepest band (-0.19 SEK/GT) sits far below that cap on this fee (10 percent of 5.17 = 0.517), so the cap cannot bind; encoded as stacked band-increment adjustments that sum exactly to each band''s published rebate.'
    rate_structure:
      type: per_unit
      unit_type: gt
      unit_rate: 5.17
    minimum: 2585
    source_reference:
      document_name: prices-and-terms-2026.pdf
      document_url: docs/sources/sweden/norvik/port-authority/prices-and-terms-2026.pdf
      page: 7
      clause: '3.1 Vessel Dues - Basic fee 5.17 SEK/GT; Minimum charge 2,585 SEK/call'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-06-17'
    adjustments:
      # ESI banded per-GT rebate, section 3.4: each adjustment is the increment
      # at its band threshold; a score meeting a threshold fires every
      # increment at or below it, summing exactly to the published band rebate
      # (e.g. ESI 85 fires -0.01..-0.10 plus the -0.04 jump at 83 = -0.14).
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 50
        stacking_order: 1
        description: 'ESI 50-52.9 band (CSI 45-47.9): -0.01 SEK/GT'
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 53
        stacking_order: 2
        description: 'ESI 53-55.9 band (CSI 48-50.9): -0.02 SEK/GT cumulative'
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 56
        stacking_order: 3
        description: 'ESI 56-59.9 band (CSI 51-53.9): -0.03 SEK/GT cumulative'
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 60
        stacking_order: 4
        description: 'ESI 60-62.9 band (CSI 54-56.9): -0.04 SEK/GT cumulative'
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 63
        stacking_order: 5
        description: 'ESI 63-66.9 band (CSI 57-59.9): -0.05 SEK/GT cumulative'
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 67
        stacking_order: 6
        description: 'ESI 67-69.9 band (CSI 60-62.9): -0.06 SEK/GT cumulative'
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 70
        stacking_order: 7
        description: 'ESI 70-72.9 band (CSI 63-65.9): -0.07 SEK/GT cumulative'
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 73
        stacking_order: 8
        description: 'ESI 73-76.9 band (CSI 66-68.9): -0.08 SEK/GT cumulative'
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 77
        stacking_order: 9
        description: 'ESI 77-79.9 band (CSI 69-71.9): -0.09 SEK/GT cumulative'
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 80
        stacking_order: 10
        description: 'ESI 80-82.9 band (CSI 72-74.9): -0.10 SEK/GT cumulative'
      - type: discount
        amount_per_gt: 0.04
        condition: esi_score >= 83
        stacking_order: 11
        description: 'ESI 83-86.9 band (CSI 75-77.9): -0.14 SEK/GT cumulative (the tariff''s 0.04 jump)'
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 87
        stacking_order: 12
        description: 'ESI 87-89.9 band (CSI 78-80.9): -0.15 SEK/GT cumulative'
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 90
        stacking_order: 13
        description: 'ESI 90-92.9 band (CSI 81-83.9): -0.16 SEK/GT cumulative'
      - type: discount
        amount_per_gt: 0.01
        condition: esi_score >= 93
        stacking_order: 14
        description: 'ESI 93-96.9 band (CSI 84-86.9): -0.17 SEK/GT cumulative'
      - type: discount
        amount_per_gt: 0.02
        condition: esi_score >= 97
        stacking_order: 15
        description: 'ESI 97-100.0 band (CSI 87-90.0): -0.19 SEK/GT cumulative (the tariff''s 0.02 jump)'

  # --- Lay-days tariff (S1 section 3.5.2, p.11) ---
  - id: snv_pos_laydays
    fee_family: port_dues
    biller: Ports of Stockholm (Stockholms Hamnar)
    name: Lay-Days Tariff (Norvik)
    description: 'A lay-day tariff applies when a vessel is docked more than 48 hours at a Ports of Stockholm quay in total before loading/unloading starts and after it is completed (Norvik rule, section 3.5.2); payable per started 24-hour period at 25% of the current harbour dues for vessels (25% of 5.17 SEK/GT = 1.2925 SEK/GT per commenced 24-hour period). Priced from the call''s lay-time hours; the default call''s 50-hour stay exceeds 48 hours, so one commenced period fires - an honest consequence of the model''s default vessel profile, computed, never hand-waved. The whole-stay reading (48-hour allowance spanning before-ops and after-ops docked time) is the conservative assumption, disclosed here (extraction reference section 11.1).'
    rate_structure:
      type: per_commenced_period
      basis: gt
      hours_input: lay_time_hours
      free_hours: 48
      period_hours: 24
      tiers:
        - up_to_excess_hours: null
          rate_per_period_per_basis: 1.2925
    source_reference:
      document_name: prices-and-terms-2026.pdf
      document_url: docs/sources/sweden/norvik/port-authority/prices-and-terms-2026.pdf
      page: 11
      clause: '3.5.2 Nynäshamn, Stockholms Norvik och Kapellskär - lay-day tariff >48 hours; 25% of the current harbour dues per started 24 hour period'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-06-17'

  # --- Container cargo dues (S1 section 3.2.3, p.8) ---
  - id: snv_pos_cargo_due_le20ft
    fee_family: port_dues
    biller: Ports of Stockholm (Stockholms Hamnar)
    name: Container Cargo Dues (Loaded < 40')
    description: 'Stockholm Norvik cargo due for each loaded container being loaded or discharged (footnote *5): loaded container < 40'' = 331 SEK/unit. The model''s le20ft bucket. The Stockholm/Nynäshamn/Kapellskär 505 SEK/cont row is out of scope for this port entry (the silo discipline).'
    rate_structure:
      type: per_unit
      unit_type: container_le20ft
      unit_rate: 331
    source_reference:
      document_name: prices-and-terms-2026.pdf
      document_url: docs/sources/sweden/norvik/port-authority/prices-and-terms-2026.pdf
      page: 8
      clause: '3.2.3 Container - Stockholm Norvik Loaded container < 40'' 331 SEK/unit (*5 fee for each loaded container being loaded or discharged)'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-06-17'

  - id: snv_pos_cargo_due_gt20ft
    fee_family: port_dues
    biller: Ports of Stockholm (Stockholms Hamnar)
    name: Container Cargo Dues (Loaded >= 40')
    description: 'Stockholm Norvik cargo due for each loaded container being loaded or discharged: loaded container >= 40'' = 424 SEK/unit. The model''s gt20ft bucket (40'' and 45'' boxes).'
    rate_structure:
      type: per_unit
      unit_type: container_gt20ft
      unit_rate: 424
    source_reference:
      document_name: prices-and-terms-2026.pdf
      document_url: docs/sources/sweden/norvik/port-authority/prices-and-terms-2026.pdf
      page: 8
      clause: '3.2.3 Container - Stockholm Norvik Loaded container >= 40'' 424 SEK/unit'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-06-17'

  # --- Waste fees (S1 section 3.8, p.12) ---
  - id: snv_pos_waste_fixed
    fee_family: waste
    biller: Ports of Stockholm (Stockholms Hamnar)
    name: Fixed Waste Fee
    description: 'Fixed waste fee 30,000 SEK per call; ships of less than 20,000 GT (or shortsea shipping, PoS''s own determination - the GT condition is priced, the shortsea alternative recorded here) receive a 15,000 SEK rebate (net 15,000). Waste fees are charged per the Swedish Transport Agency regulations (TSFS 2023:15) - the section 12 Transport Agency pattern match. At the Norvik quayside 6 m³ sludge and 4 m³ sewage are included (footnote *1).'
    rate_structure:
      type: banded_flat
      basis: gt
      bands:
        - min: null
          max: 20000
          amount: 15000
        - min: 20000
          max: null
          amount: 30000
    source_reference:
      document_name: prices-and-terms-2026.pdf
      document_url: docs/sources/sweden/norvik/port-authority/prices-and-terms-2026.pdf
      page: 12
      clause: '3.8 Waste Fees - Fixed waste fee 30,000 SEK; rebate (less than 20,000 GT or shortsea) -15,000 SEK'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-06-17'

  - id: snv_pos_waste_variable
    fee_family: waste
    biller: Ports of Stockholm (Stockholms Hamnar)
    name: Variable Waste Fee
    description: 'Variable waste fee 0.11 SEK/GT. Ships fulfilling the criteria in the Waste instructions for Ports of Stockholm receive a 50 percent variable-fee rebate (the table''s -0.06 SEK/GT); the model''s call surface carries no waste-instructions attestation, so the rebate is recorded here, never silently applied - the full rate is the default (worst case).'
    rate_structure:
      type: per_unit
      unit_type: gt
      unit_rate: 0.11
    source_reference:
      document_name: prices-and-terms-2026.pdf
      document_url: docs/sources/sweden/norvik/port-authority/prices-and-terms-2026.pdf
      page: 12
      clause: '3.8 Waste Fees - Variable waste fee 0.11 SEK/GT; rebate (Waste instructions criteria) -0.06 SEK/GT'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-06-17'

  - id: snv_pos_sludge_excess
    fee_family: waste
    biller: Ports of Stockholm (Stockholms Hamnar)
    name: Sludge above Included Volume
    description: 'Sludge 1,550 SEK/m³; at the Norvik quayside 6 m³ sludge and 4 m³ sewage are included per call (footnote *1). The user-entered excess volume (m³ beyond 6) prices this line; blank = no line. Scrubber waste 1,750 SEK/ton and sewage at Norvik (price upon request) are recorded - no published sewage figure at this port, never invented.'
    rate_structure:
      type: per_unit
      unit_type: sludge_extra_m3
      unit_rate: 1550
    source_reference:
      document_name: prices-and-terms-2026.pdf
      document_url: docs/sources/sweden/norvik/port-authority/prices-and-terms-2026.pdf
      page: 12
      clause: '3.8 Waste Fees - Sludge 1,550 SEK/m³; footnote *1 (Norvik quayside: 6 m³ sludge and 4 m³ sewage included)'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-06-17'

  # --- Boatmen (S1 section 4.1, p.14) ---
  - id: snv_pos_boatmen_mooring
    fee_family: mooring
    biller: Ports of Stockholm (Stockholms Hamnar)
    name: Boatmen - Mooring (Quay, Weekday 07-16)
    description: 'Mooring per assignment at the quay: vessel length > 130 m, weekdays 07.00-16.00: 6,637 SEK (the weekday daytime rate is the default; the model carries no time-of-day input and the off-hours/weekend rates - 9,549 / 15,588 SEK - are recorded here, a user scenario, never seeded). One mooring assignment per call.'
    rate_structure:
      type: flat
      amount: 6637
    source_reference:
      document_name: prices-and-terms-2026.pdf
      document_url: docs/sources/sweden/norvik/port-authority/prices-and-terms-2026.pdf
      page: 14
      clause: '4.1 Boatmen - Quay per assignment, Weekdays 07.00-16.00, vessel length > 130 metres: 6,637 SEK (mooring)'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-06-17'

  - id: snv_pos_boatmen_unmooring
    fee_family: mooring
    biller: Ports of Stockholm (Stockholms Hamnar)
    name: Boatmen - Unmooring (Quay, Weekday 07-16)
    description: 'Unmooring per assignment at the quay: vessel length > 130 m, weekdays 07.00-16.00: 6,637 SEK (the tariff prices mooring and unmooring equally). One unmooring assignment per call.'
    rate_structure:
      type: flat
      amount: 6637
    source_reference:
      document_name: prices-and-terms-2026.pdf
      document_url: docs/sources/sweden/norvik/port-authority/prices-and-terms-2026.pdf
      page: 14
      clause: '4.1 Boatmen - Quay per assignment, Weekdays 07.00-16.00, vessel length > 130 metres: 6,637 SEK (unmooring)'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-06-17'

  # ============ HUTCHISON PORTS SWEDEN (terminal layer, S2) ============
  # --- Quay-side container handling (S2 pp.4-5) ---
  - id: snv_hutchison_handling
    fee_family: terminal_handling
    biller: Hutchison Ports Sweden AB
    name: Container Handling over Quay (Export and Import)
    description: 'Quay-side container handling: ISO containers receiving container to stack including single lift to vessel (export) 2,012 kr per unit; import container lifted from vessel, received into stack, and loaded to road transport 2,012 kr per unit (the import line''s road-transport leg is part of the published unit rate - a basis note, not a separate figure). Each loaded/discharged container prices once at 2,012 kr. Transshipment (1,523 kr, not incl. storage) and restows (via quay 2,012 kr / on board 985 kr) carry their own counts below.'
    rate_structure:
      type: per_unit
      unit_type: move
      unit_rate: 2012
    source_reference:
      document_name: price-list-2026.pdf
      document_url: docs/sources/sweden/norvik/hutchison/price-list-2026.pdf
      page: 5
      clause: 'Container Handling over Quay - Export containers: ISO containers receiving container to stack including single lift to vessel 2012 kr; Import container: lifted from vessel, received into stack, and loaded to road transport 2012 kr'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-06-01'

  - id: snv_hutchison_transshipment
    fee_family: terminal_handling
    biller: Hutchison Ports Sweden AB
    name: Transshipment of Container (scenario)
    description: 'Transshipment of container, not including storage: 1,523 kr per unit. Scenario surface - fires only when a transshipment unit count is entered; blank renders no line.'
    rate_structure:
      type: per_unit
      unit_type: transshipment_units
      unit_rate: 1523
    scenario_adjusted:
      description: 'scenario-derived figure - the transshipment unit count is the user''s scenario input over the pinned S2 schedule; never tariff-transcribed usage'
      severity: info
    source_reference:
      document_name: price-list-2026.pdf
      document_url: docs/sources/sweden/norvik/hutchison/price-list-2026.pdf
      page: 5
      clause: 'Quay Side Handling - Transshipment of container, not incl storage 1523 kr'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-06-01'

  - id: snv_hutchison_restow_quay
    fee_family: terminal_handling
    biller: Hutchison Ports Sweden AB
    name: Restow via Quay (scenario)
    description: 'Restow via quay: 2,012 kr per unit. Scenario surface - the model carries no restow count; recorded here with its published rate, priced only if a future input exists. Not modeled this pass (no restow input); never silently dropped: the extraction reference records it.'
    rate_structure:
      type: flat
      amount: 0
    service_gap_notice:
      description: 'Restow via quay (2,012 kr/unit) and restow on board (985 kr/unit) are published S2 rates the call model has no restow-count input for; the total excludes them - a restow scenario would enter as a future input, never an invention.'
      severity: info
    source_reference:
      document_name: price-list-2026.pdf
      document_url: docs/sources/sweden/norvik/hutchison/price-list-2026.pdf
      page: 5
      clause: 'Restow via quay 2012 kr; Restow on board 985 kr'
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-06-01'

  - id: snv_hutchison_hatch_lids
    fee_family: hatch_cover
    biller: Hutchison Ports Sweden AB
    name: Hatch Lids
    description: 'Hatch lids: 1,557 kr per unit. Priced from the shared hatch-cover count input (default 0).'
    rate_structure:
      type: per_unit
      unit_type: hatch_cover_count
      unit_rate: 1557
    source_reference:
      document_name: price-list-2026.pdf
      document_url: docs/sources/sweden/norvik/hutchison/price-list-2026.pdf
      page: 6
      clause: 'Hatch Lids / Gear Box - Hatch lids 1557 kr; Gear box 908 kr'
