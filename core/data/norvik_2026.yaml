# Stockholm Norvik Port 2026
# Complete data file for Port Call Cost Analyzer - self-contained port silo
# (spec: each port file is independently verifiable with zero references to any
# other port file; the engine and fee-family vocabulary are the only shared assets)
#
# The two-document case (the Hamburg mirror): the port-authority layer (Ports
# of Stockholm, "Prices and terms 2026", cover version 2026-06-17) and the
# terminal layer (Hutchison Ports Sweden AB, "Price List 2026", valid from
# 1 June 2026 until further notice).
#
# All amounts in SEK, ex-VAT. Authority of record:
# docs/sources/sweden/norvik/NORVIK_EXTRACTION_REFERENCE.md;
# PDFs archived at docs/sources/sweden/norvik/port-authority/
# prices-and-terms-2026.pdf (SHA-256
# aba23e206f68d6667e1e44a748cd90b3992bb42bc86ec0c64a260f58130d8619) and
# docs/sources/sweden/norvik/hutchison/price-list-2026.pdf (SHA-256
# 65b33117ae7bb112636245b8a44716530005bc1ee675d2bfe853c674f3e5e087),
# both fetched 2026-10-02; both publishers' reservation clauses (revise at any
# time, latest version online) make the checksums the vintage pins.
#
# Not modeled (reference sections 4.8/10, surfaced as notices or recorded,
# never estimated): Hutchison energy surcharge (Price on Application - gap
# notice); sewage at Norvik (price upon request); reefer connection,
# weighing/VGM, washing, PTI, gate, rail, documentation, seals, decals,
# bundling, internal movements, labour - ancillary/land-side surfaces outside
# the vessel-call checkpoints (recorded in the extraction reference);
# PoS reduced vessel-dues rate 4.65 (non-PoS-quay / waste-exempt calls only -
# recorded, not a container-call default); PoS equipment-hire rows (4.3.1) -
# scenario equipment surfaces without model inputs, recorded.

metadata:
  id: norvik
  name: Stockholm Norvik Port
  country: Sweden
  currency: SEK
  validity_start: '2026-01-01'
  validity_end: '2026-12-31'
  description: 'Stockholm Norvik Port: the split structure (the Hamburg mirror) - Stockholms Hamnar (Ports of Stockholm) as port authority (vessel dues, cargo dues, waste, lay-days, boatmen) and Hutchison Ports Sweden AB as container-terminal operator (quay-side handling, storage, ISPS); Sjöfartsverket levies national fairway and pilotage fees. Sources: Prices and terms 2026 (S1, version 2026-06-17), Hutchison Price List 2026 (S2, valid from 1 June 2026).'
  document_url: https://www.portsofstockholm.com/media/4p2ociwz/ports-of-stockholm-prices-and-terms-2026_version-2026-09-29.pdf

