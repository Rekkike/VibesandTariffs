  - id: snv_hutchison_gearbox
    fee_family: gearbox_handling
    biller: Hutchison Ports Sweden AB
    name: Gear Box
    description: 'Gear box: 908 kr per unit. Priced from the shared gearbox count input (default 0).'
    rate_structure:
      type: per_unit
      unit_type: gearbox_count
      unit_rate: 908
    source_reference:
      document_name: price-list-2026.pdf
      document_url: docs/sources/sweden/norvik/hutchison/price-list-2026.pdf
