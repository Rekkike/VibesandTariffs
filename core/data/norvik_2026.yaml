  # Cargo Fee (Godsavgift) — Sjöfartsverket national cargo-based fairway due
  # (spec v0.2.61; this port's own silo transcription of the national rules).
  # Gods- och passageraravgift, the cargo-based component of the national
  # farledsavgift (Föreskrift 2025:6 om farledsavgift). One blended rule:
  # high-value tonnes at 3.36 kr/t, the low-value share at 1.67 kr/t (price
  # list 2026 p.5, effective 2026-01-01). Cargo tonnage derives from the
  # call's container counts x the shared planning weights (user-adjustable,
  # never tariff data; whole-tonne rounding per the SJÖFS 16 § rule).
  # Traffic basis: international traffic charges loaded and discharged —
  # assumed as the default (disclosed in the basis string); the domestic
  # variant (loaded only) is a recorded finding. Transit cargo is exempt
  # (loaded transit goods befriat från godsavgift, refund per §21); the
  # call model cannot represent transit cargo — disclosed in the basis
  # string. Stacks with the port's own cargo due: separate charges, both fire.
  - id: snv_sfv_godsavgift
    fee_family: fairway_dues
    biller: Sjöfartsverket
    name: Cargo Fee (Godsavgift)
    description: "National cargo-based fairway due: 3.36 kr/tonne high-value, 1.67 kr/tonne low-value; transit cargo exempt."
    rate_structure:
      type: per_unit
      unit_rate: 3.36
      unit_type: cargo_tonnage_from_containers
      cargo_tonnage:
        weight_20_input: cargo_weight_per_20ft
        weight_40_input: cargo_weight_per_40ft
        round_to_whole_tonnes: true
      value_blend:
        low_value_rate: 1.67
        low_share_input: cargo_low_value_share
        basis_note: "godsavgift 3.36 kr/t high-value / 1.67 kr/t low-value (2026 price list p.5, Föreskrift 2025:6); international basis assumed (loaded + discharged; domestic = loaded only); transit cargo exempt — not representable in the call model"
    source_reference:
      document_name: prislista-farleds-lotsavgifter-2026.txt
      document_url: docs/sources/sweden/national/sjofartsverket/prislista-farleds-lotsavgifter-2026.txt
      upstream_url: "https://www-n.sjofartsverket.se/globalassets/tjanster/anlopstjanster/sjofartsverkets-farleds--och-lotsavgifter/prislista-farleds--och-lotsavgifter-2026.pdf"
      document_issued: '2025-11-01'
      page: 5
      clause: "Gods- och passageraravgift — Högvärdigt gods 3,36 kr/ton; Lågvärdigt gods 1,67 kr/ton; lastat transitgods befriat"
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion

  # ==========================================================================
  # EU REGULATORY BLOCK (spec v0.2.69) — ETS allowances and the FuelEU notice
  # Transcribed into this port's own file per the silo principle, exactly as
  # the national Sjöfartsverket rules are: the EU instruments are EU-wide, but
  # every port file carries its own rules with its own citations and never
  # references another port's. Authority of record:
  # docs/sources/eu/EU_REGULATORY_EXTRACTION_REFERENCE.md.
  # ==========================================================================
  - id: snv_eu_ets_allowances
    fee_family: regulatory
    biller: EU (European Union) — shipping company's administering authority
    name: EU ETS Allowances (user-specified basis)
    description: "EU ETS surrender obligation for this call's in-scope emissions (Directive (EU) 2023/959 amending Directive 2003/87/EC, Articles 3ga-3gb): cargo and passenger ships of or above 5,000 GT, regardless of flag. Scope: 100 percent of in-port emissions plus the voyage fraction — 50 percent of extra-EU leg emissions, 100 percent of intra-EU (the shared arrival-origin selector carries the leg). The entered emissions figure is the user's own in-scope tonnage for this call — no published per-call figure exists; THETIS-MRV annual data may orient the entry but is never a default. The allowance price is EUA market data (EEX auctions), never a hardcoded rate. Blank inputs render nothing (the blank-means-nothing contract)."
    rate_structure:
      type: flat
      amount: 0
      ets_product:
        emissions_input: ets_emissions_tco2
        price_input: ets_allowance_price
        phase_in_fraction: 1.0
        phase_in_pct: 100
        basis_note: "ETS surrender for 2026-reported emissions at 100 percent (Directive 2003/87/EC Art. 3gb(1), inserted by Directive (EU) 2023/959: 40 percent of 2024-reported, 70 percent of 2025-reported, 100 percent of 2026-reported onward); leg scope per the shared arrival-origin selector (extra-EU leg: 50 percent of voyage emissions + 100 percent in-port; intra-EU: 100 percent); allowances are surrendered in EUR (the EU-market instrument's own currency)"
    applicable_conditions:
      min_gt: 5000
    estimated_parameter:
      description: "derived from user-specified inputs — the emissions basis and the EUA price are the user's own (no published per-call emissions figure or allowance price exists; THETIS-MRV annual figures orient the entry, never default it)"
      severity: info
    source_reference:
      document_name: "faq-maritime-ets.html.md (official Commission FAQ; Directive (EU) 2023/959 the instrument)"
      document_url: "docs/sources/eu/ets/faq-maritime-ets.html.md"
      upstream_url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023L0959"
      document_issued: "2023-05-10"
      page: "Timing & scope"
      clause: "Directive 2003/87/EC Art. 3ga-3gb as inserted by Directive (EU) 2023/959; surrender fractions 40/70/100 percent of 2024/2025/2026-reported emissions"
      verified_on: "2026-10-02"
      verified_by: "vibe-session-swedish-expansion"

  - id: snv_fueleu_notice
    fee_family: regulatory
    biller: EU (European Union) — FuelEU compliance balance
    name: FuelEU Maritime — annual compliance balance (notice, no per-call charge)
    description: "FuelEU Maritime (Regulation (EU) 2023/1805, Art. 4) applies to this vessel at this port (commercial ship above 5,000 GT): the yearly average GHG intensity of the energy used on board is limited against the 2020 reference value 91.16 gCO2e/MJ, reduced 2 percent for 2025-2029 (limit 89.34 gCO2e/MJ); in-scope energy is 100 percent intra-EU voyages and at berth, 50 percent on extra-EU legs. The compliance balance is assessed ANNUALLY per ship (with pooling, banking, and borrowing across ships and years, Arts. 20-21); a deficit is penalised at 2,400 EUR per tonne VLSFO-equivalent energy (Art. 23, Annex IV B). A per-call FuelEU charge cannot be computed honestly — no per-call figure is rendered; this line is a notice only and adds nothing to any total."
    rate_structure:
      type: flat
      amount: 0
    regulatory_notice:
      description: "FuelEU Maritime applies to this vessel at this port (commercial ship above 5,000 GT, Regulation (EU) 2023/1805 Art. 2/4): the yearly average GHG intensity of the energy used on board is limited against the 2020 reference value 91.16 gCO2e/MJ minus 2 percent for 2025-2029 (limit 89.34 gCO2e/MJ), well-to-wake; a compliance deficit is penalised at 2,400 EUR per tonne VLSFO-equivalent energy (Art. 23, Annex IV B). The compliance balance is ANNUAL per ship with pooling, banking, and borrowing across ships and years (Arts. 20-21) — a per-call FuelEU charge cannot be computed honestly, so no per-call figure is rendered; this notice adds nothing to any total."
      severity: info
    applicable_conditions:
      min_gt: 5000
    source_reference:
      document_name: "fueleu-maritime.html.md + fueleu-qa.html.md (official Commission pages; Regulation (EU) 2023/1805 the instrument)"
      document_url: "docs/sources/eu/fueleu/fueleu-maritime.html.md"
      upstream_url: "https://eur-lex.europa.eu/eli/reg/2023/1805/oj/eng"
      document_issued: "2023-09-13"
      page: "Key facts"
      clause: "Regulation (EU) 2023/1805 Art. 4 (91.16 reference, 2 percent 2025-2029), Arts. 20-21 (banking/borrowing/pooling), Art. 23 + Annex IV B (2,400 EUR/t VLSFO-eq penalty)"
      verified_on: "2026-10-02"
      verified_by: "vibe-session-swedish-expansion"

# Per-port default-call data (spec v0.2.59).
default_call:
  towage_cost_per_tug: 60000
  tug_count: null

# OPS speculative component descriptor (spec v0.2.57, data-authored v0.2.59):
# neither S1 nor S2 publishes an OPS-specific figure for Norvik: all four
# components render, the least-defined public posture.
ops_speculative:
  electricity: { enabled: true, currency: SEK, unit: SEK/kWh }
  demand: { enabled: true, currency: SEK, unit: SEK/call }
  connection: { enabled: true, currency: SEK, unit: SEK/call }
  per_gt: { enabled: true, currency: SEK, unit: SEK/GT }

# Per-port input profile (spec v0.2.59).
input_profile:
  reset_fields:
    - engine_tier
    - engine_tier_estimated
    - esi_score
    - issc_valid
    - clean_shipping_index_class
    - towage_cost_per_tug
    - tug_count
    - csi_class
    - fossil_free_fuel_percentage
    - pilotage_hours
    - pilotage_extra_pilot
    - pilotage_ordering_lead_time_hours
    - hatch_cover_count
    - gearbox_count
    - lay_up_days
    - ops_electricity_price
    - ops_demand_charge
    - ops_connection_charge
    - ops_per_gt_charge
    - ets_emissions_tco2
    - ets_allowance_price
    - transshipment_units
    - storage_days_hazardous
  # Field-level inputs inside the shared general-information group: the
  # port carries none (no port-side CSI-class discount key exists at this
  # port - declared explicitly, never silently absent).
  fields: []
  sections:
    - id: godsavgift_parameters
      heading: Cargo tonnage for godsavgift (planning weights)
    - id: norvik_call_parameters
      heading: Stockholm Norvik Call Parameters
    - id: eu_regulatory
      heading: EU Regulatory (ETS allowances - user-specified basis)
