  # ==========================================================================
  # TERMINAL HANDLING NOTICE (Unit 5) - the separately-billed surface with
  # no published rate. The archived documents evidence the surface: R1's
  # own scope statement (Article 3: these are the General Terms and
  # Conditions for Port Dues, Inland Port Dues and the Waste fee - the port
  # authority's tariff covers dues, waste and the quay fees, never the
  # container terminal operators' handling), and R3 (the Tariffs of Third
  # Parties 2026) prices towage, pilotage and the boatmen - no stevedoring
  # tariff appears in any archived document. The deep-sea container
  # terminal operators at Maasvlakte (the model's default berth area) bill
  # handling separately from the port authority; no rate is published in
  # the archived record. The notice follows the GOT mooring precedent: a
  # zero-amount line with the service_gap_notice flag - never a zero
  # rendered as a figure, never an invented rate, nothing added to any
  # total.
  # ==========================================================================
  - id: rotterdam_handling_notice
    fee_family: terminal_handling
    biller: Container terminal operators (Maasvlakte) - separately billed
    name: 'Terminal handling — separately billed, no published rate (notice)'
    description: "Container handling at Rotterdam is performed by the deep-sea terminal operators at Maasvlakte and billed separately from Havenbedrijf Rotterdam N.V.'s tariff: R1's own scope statement (Article 3) limits these General Terms and Conditions to Port Dues, Inland Port Dues and the Waste fee, and R3 (the Tariffs of Third Parties 2026) prices towage, pilotage and the KRVE boatmen - no stevedoring rate appears anywhere in the archived record. This call's total EXCLUDES the handling cost; this line is a notice only and adds nothing to any total."
    rate_structure:
      type: flat
      amount: 0
    service_gap_notice:
