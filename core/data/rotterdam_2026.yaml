      default_by_loa:
        bands:
          - max_m: 150
            count: 0
            description: 'LOA < 150 m: 0 tugs'
          - min_m: 150
            max_m: 250
            count: 1
            description: '150-250 m: 1 tug'
          - min_m: 250
