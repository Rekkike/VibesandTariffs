# ============================================================================
# Port of Rotterdam 2026 — the ninth port silo (v0.7.0 Rotterdam expansion)
#
# Authority of record: docs/sources/netherlands/rotterdam/
# ROTTERDAM_EXTRACTION_REFERENCE.md (the per-port pattern; every figure below
# is transcribed from the archived documents with the citations carried).
#
# All amounts in EUR. The engine prices in EUR natively; the SEK comparison
# basis runs through the published-pairs machinery (the EUR pair in
# core/data/exchange_rates.yaml), never a fixed ratio in code.
#
# Biller: Havenbedrijf Rotterdam N.V. (the port authority — seaport dues,
# buoy/dolphin/public quay dues, and the waste fee for seagoing vessels are
# invoiced with one combined invoice per the ToC Article 5.1).
#
# The 2026 tariff year: the General Terms and Conditions including Port
# Tariffs 2026 (the seaport-dues recalculation introduced 2025 — the
# sustainability component added to the per-GT basis, the efficiency
# consideration on cargo; indexation 3.5% for 2026 per the published tariff
# communication).
# ============================================================================
metadata:
  id: rotterdam
  name: Port of Rotterdam
  country: Netherlands
  currency: EUR
  validity_start: "2026-01-01"
  validity_end: "2026-12-31"
  description: "Rotterdam port call costs: the Havenbedrijf Rotterdam General Terms and Conditions including Port Tariffs 2026 (seaport dues — the vessel component and the sustainability component per GT with the ESI discount bands, cargo dues per tonne with the GT-efficiency cap, the waste fee for seagoing vessels — flat plus per-GT with the whole-fee maximum, the buoy/dolphin and public quay dues). The seaport-dues recalculation introduced 2025 (sustainability and efficiency); indexation 3.5% for 2026."

billers:
  - id: havenbedrijf_rotterdam
    name: Havenbedrijf Rotterdam N.V.
    description: "The port authority: seaport dues, buoy, dolphin and public quay dues, and the waste fee for Seagoing Vessels (invoiced with one combined invoice, ToC Article 5.1)"
    currency: EUR
  - id: boluda_towage_rotterdam
    name: Boluda Towage Rotterdam B.V.
    description: "The adjudicated default towage operator (the median MV2 per-tug rate at the MAREN reference LOA band; the Maasvlakte 2 area schedule, maximum assistance time 2.5 hours)"
    currency: EUR
  - id: krve
    name: KRVE (Koninklijke Roeiers Vereeniging Eendracht)
    description: "The boatmen concession (mooring, unmooring, shifting; mandatory in practice)"
    currency: EUR
  - id: nederlandse_loodswezen_rr
    name: Nederlands Loodswezen (region Rotterdam-Rijnmond)
    description: "The pilotage authority: the compulsory pilotage voyages to and from the pilot station (Sea to tariff area J and back), priced per the Pilotage Tariffs 2026 brochure"
    currency: EUR

fee_rules:
  # ==========================================================================
  # SEAPORT DUES — ToC §2.2 (Articles 7-15); rates per Annex 1
  # ==========================================================================
  - id: rotterdam_seaport_dues
    fee_family: port_dues
    biller: Havenbedrijf Rotterdam N.V.
    name: Seaport Dues (vessel and sustainability components)
    description: "ToC §2.2 Article 8.1 with Annex 1: the seaport dues — the vessel component (EUR 0.151 per GT) plus the sustainability component (EUR 0.067 per GT), both over the vessel's gross tonnage per the International Tonnage Certificate (Article 8.2: only whole GT units count). The sustainability component is the 2025-recalculation's sustainability pillar; the ESI discount (Annex 1 §1.4, Article 12.1) discounts the sustainability component by the ESI-score band. Whole-GT basis; no tranche, no cap on the GT basis."
    rate_structure:
      type: composite_tranche
      basis: gt
      tranches:
        - min: null
          max: null
          components:
            vessel: 0.151
            sustainability: 0.067
      component_labels:
        vessel: Vessel component
        sustainability: Sustainability component
      component_adjustments:
        sustainability:
          # ESI discount on the sustainability component (Annex 1 §1.4,
          # verified live at portofrotterdam.com/en/sea-shipping/seaport-dues/
          # environmental-ship-index-discount): score bands 5/10/60/80/100
          # percent. The published table's sixth band (ESI >= 81 with ESI NOx
          # >= 60) carries 120% — it requires the ESI NOx sub-score, an input
          # the model does not carry; the unconditional 100% band at ESI >= 61
          # is the least-favourable encoding (never overstate a benefit), the
          # 120% NOx variant recorded in the extraction reference.
          - kind: score_discount_pct_with_cap
            input: esi_score
            description: "ESI discount"
            bands:
              - { min: 1, max: 21, pct: 5 }
              - { min: 21, max: 31, pct: 10 }
              - { min: 31, max: 41, pct: 60 }
              - { min: 41, max: 61, pct: 80 }
              - { min: 61, max: null, pct: 100 }
    source_reference:
      document_name: "General Terms and Conditions including Port Tariffs — Port Tariffs 2026"
      document_url: "docs/sources/netherlands/rotterdam/port-of-rotterdam/port-tariffs-and-conditions-port-of-rotterdam-2026.pdf"
      upstream_url: "https://www.portofrotterdam.com/sites/default/files/2025-12/port-tariffs-and-conditions-port-of%20-rotterdam-2026.pdf"
      document_issued: "2026-01-01"
      page: "Annex 1"
      clause: "Article 8.1; Annex 1 seaport-dues table; Annex 1 §1.4 ESI discount table"
      verified_on: "2026-10-08"
      verified_by: "vibe-session-rotterdam-expansion"

  - id: rotterdam_cargo_dues
    fee_family: cargo_fee
    biller: Havenbedrijf Rotterdam N.V.
    name: Seaport Dues (cargo component, GT-efficiency capped)
    description: "ToC §2.2 Article 8.1 with Annex 1: the cargo leg of the seaport dues — EUR 0.562 per tonne of Cargo (the ToC definition: all merchandise, containers and trailers loaded and discharged, expressed in metric tonnes; Article 8.2 whole-unit counting). The 2025 recalculation's efficiency pillar: the chargeable tonnage is capped at the GT-implied ceiling (35% of the vessel's GT) — a vessel is not charged for cargo tonnage beyond what its size implies it can carry; the cap's delta renders as a discount on the line, never a silent reduction. Chargeable tonnes derive from the call's container counts and the shared planning weights (the cargo_tonnage machinery), the godsavgift convention."
    rate_structure:
      type: per_unit
      unit_type: cargo_tonnage_from_containers
      unit_rate: 0.562
      cargo_tonnage:
        weight_20_input: cargo_weight_per_20ft
        weight_40_input: cargo_weight_per_40ft
        round_to_whole_tonnes: true
      gt_efficiency_cap:
        cap_pct: 35
        description: "GT-efficiency cap: chargeable tonnage capped at 35% of the vessel's GT (the 2025 recalculation's efficiency consideration)"
    source_reference:
      document_name: "General Terms and Conditions including Port Tariffs — Port Tariffs 2026"
      document_url: "docs/sources/netherlands/rotterdam/port-of-rotterdam/port-tariffs-and-conditions-port-of-rotterdam-2026.pdf"
      upstream_url: "https://www.portofrotterdam.com/sites/default/files/2025-12/port-tariffs-and-conditions-port-of%20-rotterdam-2026.pdf"
      document_issued: "2026-01-01"
      page: "Annex 1"
      clause: "Article 8.1; Annex 1 seaport-dues cargo table; Article 1(d) Cargo definition"
      verified_on: "2026-10-08"
      verified_by: "vibe-session-rotterdam-expansion"

  # ==========================================================================
  # WASTE FEE FOR SEAGOING VESSELS — ToC §2.4 (Articles 17-20); rates Annex 1
  # ==========================================================================
  - id: rotterdam_waste_fee
    fee_family: waste
    biller: Havenbedrijf Rotterdam N.V.
    name: Waste Fee for Seagoing Vessels
    description: "ToC §2.4 Article 18 with the Annex 1 waste-fee rate table: the contribution in the costs of receipt, storage and disposal of ship-related waste (MARPOL 73/78 Annex I oil and Annex V solid; Article 1(jj), the Dutch Prevention of Pollution from Ships Act Article 6(1)) — incurred whether or not waste is actually issued (Article 17.1). EUR 220 flat plus EUR 0.05 per GT, with the published maximum of EUR 2,000 capping the whole fee (the flat and the per-GT part together — the published maximum is a whole-fee ceiling; at the MAREN default's 194,849 GT the fee is at its maximum)."
    rate_structure:
      type: flat
      amount: 220
      flat_plus_per_gt:
        per_gt_rate: 0.05
        per_gt_maximum: 2000
    source_reference:
      document_name: "General Terms and Conditions including Port Tariffs — Port Tariffs 2026"
      document_url: "docs/sources/netherlands/rotterdam/port-of-rotterdam/port-tariffs-and-conditions-port-of-rotterdam-2026.pdf"
      upstream_url: "https://www.portofrotterdam.com/sites/default/files/2025-12/port-tariffs-and-conditions-port-of%20-rotterdam-2026.pdf"
      document_issued: "2026-01-01"
      page: "Annex 1"
      clause: "Article 17.1; Article 18; Annex 1 waste-fee rate table"
      verified_on: "2026-10-08"
      verified_by: "vibe-session-rotterdam-expansion"

  # ==========================================================================
  # BUOY, DOLPHIN AND PUBLIC QUAY DUES — ToC §2.3 (Article 16); rates Annex 1
  # ==========================================================================
  - id: rotterdam_public_quay_dues
    fee_family: port_dues
    biller: Havenbedrijf Rotterdam N.V.
    name: "Public Quay Dues (berth_type: 'quay' gated)"
    description: "ToC §2.3 Article 16 with the Annex 1 buoy/dolphin/public-quay table: for use of the public quays with a Seagoing Vessel — EUR 3.86 per metre (or part thereof) of the ship's length overall, per 24 hours or part thereof (verified live at portofrotterdam.com, the public-quay rate). Condition-gated on berth_type 'quay': the fee only fires when the call's berth type is the public quay (Article 16.1: use of buoys, dolphin constructions or public quays) — a container call at a terminal berth carries none of it; the rule never default-fires."
    rate_structure:
      type: per_commenced_period
      basis: loa
      hours_input: quay_hours
      free_hours: 0
      period_hours: 24
      tiers:
        - up_to_excess_hours: null
          rate_per_period_per_basis: 3.86
    applicable_conditions:
      berth_type: quay
    source_reference:
      document_name: "General Terms and Conditions including Port Tariffs — Port Tariffs 2026"
      document_url: "docs/sources/netherlands/rotterdam/port-of-rotterdam/port-tariffs-and-conditions-port-of-rotterdam-2026.pdf"
      upstream_url: "https://www.portofrotterdam.com/sites/default/files/2025-12/port-tariffs-and-conditions-port-of%20-rotterdam-2026.pdf"
      document_issued: "2026-01-01"
      page: "Annex 1"
      clause: "Article 16.1; Annex 1 buoy/dolphin/public-quay table"
      verified_on: "2026-10-08"
      verified_by: "vibe-session-rotterdam-expansion"

  # ==========================================================================
  # TOWAGE (Unit 4a) - Boluda Towage Rotterdam B.V., the adjudicated default
  # operator (the median MV2 per-tug rate at the MAREN reference LOA band;
  # the Fairplay and Svitzer figures are recorded in the extraction
  # reference section 8.1). The Maasvlakte 2 area schedule (row 2, maximum
  # assistance time 2.5 hours) prices each tug by LOA band. The tug count
  # rides the estimated-parameter convention - the settled shared LOA-class
  # default (<150 m: 0; 150-250 m: 1; >250 m: 2), user-overridable, never
  # re-flagged, never re-invented. Towage is default-fired per the
  # comparability principle.
  # ==========================================================================
  - id: rotterdam_towage
    fee_family: towage
    biller: Boluda Towage Rotterdam B.V.
    name: 'Towage (Boluda, Maasvlakte 2 area - per tug by LOA band)'
    description: "R3 (Tariffs of Third Parties 2026), the Boluda Towage Rotterdam B.V. schedule, row 2 the Maasvlakte 2 area (from the river to the berth or vice versa, maximum assistance time 2.5 hours), rates per move and for each tug employed, EUR, by the vessel's length overall per Lloyd's Register. The default-operator adjudication (recorded in the extraction reference section 8.1): no operator preference exists in the document, so the median MV2 per-tug rate at the MAREN reference LOA band selects Boluda (10,239 against Fairplay's 10,312.50 with the Maasvlakte II surcharge and Svitzer's 5,737; the base-rate cross-check 8,191 also selects Boluda) - the least-biased documentable choice, disclosed. The tug count is the settled shared LOA-class default (the estimated-parameter convention, user-overridable). Waiting 1,625/h, dead ships +50%, fog +50%, LNG restrictions +150%, deep-draught restrictions +50%, holidays +25%, shifting-within-area +50% (all recorded in the reference, none default-call services)."
    rate_structure:
      type: per_unit
      unit_type: tug_count
      unit_rate: 0
      count_input: tug_count
      banded_by_loa:
        bands:
          - { min: null, max: 163, amount: 3729 }
          - { min: 163, max: 175, amount: 4236 }
          - { min: 175, max: 187, amount: 4743 }
          - { min: 187, max: 212, amount: 5281 }
