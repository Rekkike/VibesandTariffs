    fee_family: pilotage
    biller: Hafenlotsengesellschaft Bremerhaven
    name: Hafenlotsgeld (Port Pilotage, under 13,000 BRZ)
    description: "HGebO 12(7).1: the port pilots' Beratungsgeld in Bremerhaven without lock use for vessels under 13,000 BRZ: base 41.80 EUR plus 1.27 EUR per commenced 100 BRZ (the consolidated 2026 statute's own figures). The band bound carries the unter-13,000 gate (the ab-13,000 sibling's complement; exactly 13,000 BRZ prices the ab-13k rule - ab, lower-inclusive)."
    rate_structure:
      type: banded_flat
      basis: gt
      bands:
        - min: null
          max: 12999
          amount: 41.80
      linear_extension:
        from_basis: 0
        per_basis_units: 100
        amount: 1.27
    source_reference:
