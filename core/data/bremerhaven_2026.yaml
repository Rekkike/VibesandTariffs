  # ==========================================================================
  # EUROGATE CTB terminal layer (the default operator; national-class P&C)
  # ==========================================================================
  - id: eurogate_ctb_berthing_charge
    fee_family: vessel_fee
    biller: EUROGATE Container Terminal Bremerhaven
    name: Berthing Charge / Tonnage Dues
    description: "EUROGATE CTB berthing charge (ch. 2): every ship berthed at the handling facilities pays a berthing charge based on GT and lay time - 1.04 EUR/GT for the first 24 h of lay days, then 0.60 EUR/GT per commenced 12 h or part. Lay time runs docking to casting off, calculated uninterruptedly (2.1.1-2.1.2; the national-class rates are identical to the Hamburg terminal's). Ship's dues are billed separately from handling (ch. 5)."
    rate_structure:
      type: tiered_per_period
      basis: gt
      hours_input: lay_time_hours
      initial_tier:
        hours: 24
        rate_per_basis: 1.04
      subsequent_tier:
        period_hours: 12
        rate_per_basis: 0.60
    applicable_conditions:
      terminal_operator: Eurogate
    source_reference:
      document_name: "prices-and-conditions-2026.txt"
      document_url: "docs/sources/germany/bremerhaven/eurogate/prices-and-conditions-2026.txt"
      document_issued: "2026-01-01"
      page: 4
      clause: "2.1.1-2.1.2"
      verified_on: "2026-10-05"
      verified_by: "vibe-session-bremerhaven-expansion"
  - id: eurogate_ctb_container_handling
    fee_family: terminal_handling
    biller: EUROGATE Container Terminal Bremerhaven
    name: Container Handling (waterside lift)
    description: "EUROGATE CTB waterside handling: loading/discharging ISO containers (full or empty) from/to main vessel, feeder or barge, 358.00 EUR per container lift (5.1.1). A move is one container lifted once. Published rate - no estimated-parameter flag. Does not bundle berth time; vessel charges are a separate chapter. The 358.00 covers the vessel-to-quay lift ONLY - ch. 6 receiving and delivery from/to rail/truck is a separate 152.00 EUR per movement (6.1.1) never included in this figure (the Hamburg extraction's basis finding, verified against the same national-class document)."
    rate_structure:
      type: per_unit
      unit_type: move
      unit_rate: 358.00
    applicable_conditions:
      terminal_operator: Eurogate
    source_reference:
      document_name: "prices-and-conditions-2026.txt"
      document_url: "docs/sources/germany/bremerhaven/eurogate/prices-and-conditions-2026.txt"
      document_issued: "2026-01-01"
      page: 6
      clause: "5.1.1"
      verified_on: "2026-10-05"
      verified_by: "vibe-session-bremerhaven-expansion"
  - id: eurogate_ctb_security_charge
    fee_family: security
