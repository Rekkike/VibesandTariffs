  # ==========================================================================
  # HGebO layer - Hafenlotsengesellschaft Bremerhaven (port pilotage)
  # ==========================================================================
  - id: brv_hafenlotsgeld_ab13k
    fee_family: pilotage
    biller: Hafenlotsengesellschaft Bremerhaven
    name: Hafenlotsgeld (Port Pilotage, from 13,000 BRZ)
    description: "HGebO 12(7).2: the port pilots' Beratungsgeld in Bremerhaven without lock use (the container terminals sit on the Aussenweser stromkaje - no lock transit): base 211.69 EUR plus 1.03 EUR per commenced 100 BRZ over 13,000 (the consolidated 2026 statute's own figures). One Beratungsgeld per call (the call's port-pilot assignment; the shifting-counts-two rule 12(7).6 is a within-port movement case). Owed by seagoing vessels over 500 BRZ even without accepting a pilot (12(7).7, then reduced 25%); the modeled call accepts pilots and pays the full fee."
    rate_structure:
      type: banded_flat
      basis: gt
      bands:
        - min: 12999
          max: null
          amount: 211.69
      linear_extension:
        from_basis: 13000
        per_basis_units: 100
        amount: 1.03
    source_reference:
      document_name: "hgebo-consolidated-2026.txt"
      document_url: "docs/sources/germany/national/bremen/hgebo-consolidated-2026.txt"
      document_issued: "2026-01-01"
      page: "HGebO 12(7).2"
      clause: "12(7).2"
      verified_on: "2026-10-05"
      verified_by: "vibe-session-bremerhaven-expansion"
