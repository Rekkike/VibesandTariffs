# Bremerhaven 2026 port file - Port Call Cost Analyzer
# Extraction authority: docs/sources/germany/bremerhaven/BREMERHAVEN_EXTRACTION_REFERENCE.md
# All amounts in EUR. Billers: bremenports (HGebO), Hafenlotsengesellschaft
# Bremerhaven (HGebO 12), GDWS (federal pilotage, Weser), EUROGATE CTB
# (default terminal), North Sea Terminal Bremerhaven (the switchable variant,
# reference-tariff flagged), towage operators (estimated).
# Terminal scope (the Hamburg v0.2.49 mechanism): a Bremerhaven call is priced
# against a named terminal operator. EUROGATE CTB items apply only to Eurogate
# calls (the default); NTB items only to NTB calls (the variant, every line
# carrying the reference-tariff honesty caveat). Port-wide charges (Raumgebuehr,
# waste, Hafenlotsgeld, GDWS pilotage, towage) are operator-neutral.
metadata:
  id: bremerhaven
  name: Port of Bremerhaven
  country: Germany
  currency: EUR
  validity_start: "2026-01-01"
  validity_end: "2026-12-31"
  description: "Bremerhaven port call costs: the Bremische Hafengebuehrenordnung (Raumgebuehr, waste fee, Hafenlotsgeld; the consolidated 2026 statute carries the fee tables inline), GDWS pilotage (the Weser sea approach), the EUROGATE CTB terminal layer (default) or the NTB reference tariff (variant). Towage is an estimated parameter (no published tariff)."
billers:
  - id: bremenports
    name: bremenports GmbH & Co. KG
    description: "The beleihene port-management entity (HGebO 2(2), per 17 Bremisches Hafenbetriebsgesetz): Raumgebuehr (port fee) and the Abfallentsorgungsgebuehr (waste fee)"
    currency: EUR
  - id: hafenlotsen_bremerhaven
    name: Hafenlotsengesellschaft Bremerhaven
    description: "The zustaendige entity for the Bremerhaven port pilots (HGebO 2(4), 12): the Hafenlotsgeld (Beratungsgeld)"
    currency: EUR
  - id: gdws
    name: GDWS (Federal) via pilot station
    description: "Federal pilotage dues and pilot fees for the Weser sea approach (Lotstarifverordnung, Anlagen 1 and 2)"
    currency: EUR
  - id: eurogate_ctb
    name: EUROGATE Container Terminal Bremerhaven
    description: "EUROGATE CTB - the national-class Prices and Conditions (effective 01.03.2026): berthing charge, waterside handling, security, the 1.5% social fund, the gated optional services and storage schedules"
    currency: EUR
    surcharge:
      id: eurogate_ctb_social_fund_surcharge
      name: Social Fund Surcharge
      fee_family: social_fund
      percentage: 1.5
      exclude_families:
        - storage
        - security
      source_reference:
        document_name: "prices-and-conditions-2026.txt"
        document_url: "docs/sources/germany/bremerhaven/eurogate/prices-and-conditions-2026.txt"
        document_issued: "2026-01-01"
        page: 2
        clause: "1.3.13"
        verified_on: "2026-10-05"
        verified_by: "vibe-session-bremerhaven-expansion"
  - id: ntb
    name: North Sea Terminal Bremerhaven GmbH & Co.
    description: "NTB - the switchable terminal variant; its published Reference tariff (valid 01.08.2026) is a reference scale, not the binding contract tariff: every NTB line carries the reference-tariff honesty caveat, never presented as verified contract rates"
    currency: EUR
    surcharge:
      id: ntb_social_fund_surcharge
      name: Social Fund Surcharge
      fee_family: social_fund
      percentage: 1.5
      exclude_families:
        - storage
        - security
      source_reference:
        document_name: "ntb-reference-tariff-en-2026-08-01.txt"
        document_url: "docs/sources/germany/bremerhaven/ntb/ntb-reference-tariff-en-2026-08-01.txt"
        document_issued: "2026-08-01"
        page: "General regulations"
        clause: "1,5 % social fund (with the exception of demurrage charges and security surcharge)"
        verified_on: "2026-10-05"
        verified_by: "vibe-session-bremerhaven-expansion"
fee_rules:
  # ==========================================================================
  # HGebO layer - bremenports (the statute-as-authority; fee tables inline)
  # ==========================================================================
  - id: brv_raumgebuehr_overseas_liner
    fee_family: port_dues
    biller: bremenports GmbH & Co. KG
    name: Raumgebuehr (Port Fee, Overseas Liner)
    description: "The HGebO 6 port fee for a five-day period from seagoing vessels transshipping cargo (BRZ basis): the Ueberseeverkehr Linienverkehr/Spezialverkehr rate 0.3038 EUR/BRZ (the 26.11.2025 amendment's consolidated 2026 table). Gated on the arrival-origin dimension: an arrival from outside Europe prices this line (the default call's Asia-Europe liner leg)."
    rate_structure:
      type: per_unit
      unit_type: gt
      unit_rate: 0.3038
    applicable_conditions:
      arrival_origin: outside-europe
    source_reference:
      document_name: "hgebo-consolidated-2026.txt"
      document_url: "docs/sources/germany/national/bremen/hgebo-consolidated-2026.txt"
      document_issued: "2026-01-01"
      page: "HGebO 6 (Raumgebuehr table)"
      clause: "6; traffic-area definitions 2(26)"
      verified_on: "2026-10-05"
      verified_by: "vibe-session-bremerhaven-expansion"
  - id: brv_raumgebuehr_europe_liner
    fee_family: port_dues
    biller: bremenports GmbH & Co. KG
    name: Raumgebuehr (Port Fee, Europe Liner)
    description: "The HGebO 6 port fee, Europaverkehr Linienverkehr/Spezialverkehr rates (GT-banded): 0.1535 EUR/BRZ up to 14,000 BRZ, 0.2368 from 14,000 to 21,000, 0.2763 above 21,000 (the consolidated 2026 table). Gated on the arrival-origin dimension: a European arrival prices this line at the conservative Europaverkehr rates (the Short Sea subdivision 0.0438/0.1210 is recorded in the input-coverage matrix - the binary origin selector cannot key it; never silently dropped)."
    rate_structure:
      type: banded_flat
      basis: gt
      bands:
        - min: null
          max: 14000
          rate: 0.1535
        - min: 14000
          max: 21000
          rate: 0.2368
        - min: 21000
          max: null
          rate: 0.2763
    applicable_conditions:
      arrival_origin: europe
    source_reference:
      document_name: "hgebo-consolidated-2026.txt"
      document_url: "docs/sources/germany/national/bremen/hgebo-consolidated-2026.txt"
      document_issued: "2026-01-01"
      page: "HGebO 6 (Raumgebuehr table)"
      clause: "6; traffic-area definitions 2(26)"
      verified_on: "2026-10-05"
      verified_by: "vibe-session-bremerhaven-expansion"
  - id: brv_raumgebuehr_extension_overseas
    fee_family: port_dues
    biller: bremenports GmbH & Co. KG
    name: Raumgebuehr Extension (beyond five days)
    description: "HGebO 3b(2): vessels using the port longer than five days pay, for each further commenced ten-day period, 50 percent of the respective fee rate - 50% of the overseas liner rate = 0.1519 EUR/BRZ per commenced 10-day period (240 h) beyond the five-day (120 h) period. Gated on port time beyond 120 h (falls back to lay time). The Europaverkehr-side extension is recorded in the extraction reference (the GT-band x time-period nesting has no engine rate shape - stop-and-report, never improvised)."
    rate_structure:
      type: per_commenced_period
      basis: gt
      hours_input: port_time_hours
      fallback_hours: lay_time_hours
      free_hours: 120
      period_hours: 240
      tiers:
        - up_to_excess_hours: null
          rate_per_period_per_basis: 0.1519
    applicable_conditions:
      arrival_origin: outside-europe
    source_reference:
      document_name: "hgebo-consolidated-2026.txt"
      document_url: "docs/sources/germany/national/bremen/hgebo-consolidated-2026.txt"
      document_issued: "2026-01-01"
      page: "HGebO 3b(2)"
      clause: "3b(2)"
      verified_on: "2026-10-05"
      verified_by: "vibe-session-bremerhaven-expansion"
  - id: brv_abfallentsorgung
    fee_family: waste
    biller: bremenports GmbH & Co. KG
    name: Abfallentsorgungsgebuehr (Waste Fee)
    description: "HGebO 10(1): the MARPOL Annex V waste-disposal fee from raumgebuehrpflichtige vessels for a five-day period, GT-banded flat amounts (non-cruise bands): 127.18 up to 1,500 GT rising to 885.84 above 45,000 GT. The free quantities (10(3)) and the on-request excess disposal (50% of the fee per disposal) are the contractor's operational surface - recorded, not encoded."
    rate_structure:
