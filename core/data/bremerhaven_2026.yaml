  - id: bremerhaven_towage_estimate
    fee_family: towage
    biller: Towage operators (estimated)
    name: Towage (estimated)
    description: "Towage per call. No published tariff (the German deep-sea tug market). Default 15,000 EUR per call (3 tugs x ~5,000 EUR/tug market range, the Hamburg convention - the Weser approach is 32 nm from open sea; the default stays at the market-range figure rather than inventing a port-specific one). User-editable. Operator-neutral: applies at any Bremerhaven terminal."
    rate_structure:
      type: flat
      amount: 15000
      amount_input: towage_amount
    estimated_parameter:
      description: "estimated; no published tariff; default 3 tugs x ~5,000 EUR/tug market range (the Hamburg convention)"
