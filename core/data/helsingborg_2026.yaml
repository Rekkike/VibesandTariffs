# Port of Helsingborg 2026 Tariff
# Complete data file for Port Call Cost Analyzer - self-contained port silo
# (spec: each port file is independently verifiable with zero references to any
# other port file; the engine and fee-family vocabulary are the only shared assets)
# All amounts in SEK, ex-VAT. Authority of record: docs/sources/sweden/helsingborg/
# HELSINGBORG_EXTRACTION_REFERENCE.md (commit d3a9ad8); tariff PDF stored at
# docs/sources/sweden/helsingborg/port-authority/tariff-2026.pdf
# Not modeled in v1 (reference section 9, surfaced as notices, never estimated):
# godsavgift (needs cargo-tonnage input) - not yet encoded;
# Dalshult stuffing/stripping/warehousing (third party, no published rates);
# OOG handling ("as per request", no published rate);
# scrubber waste beyond the sludge allowance (actual cost; the sludge-excess rule
# poh_sludge_excess carries the port's 2,075 SEK/m3 + 15% admin basis for it);
# pumping charge (liquid bulk only); access cards, photography, labour overtime.
metadata:
  id: helsingborg
  name: Port of Helsingborg
  country: Sweden
  currency: SEK
  validity_start: '2026-01-01'
  validity_end: '2026-12-31'
  description: 'Helsingborgs Hamn AB (556024-0979) acts as port authority and terminal operator (West Harbour container
    terminal); Sjöfartsverket levies national fairway and pilotage fees; towage estimated. Sources: Tariff 2026
    (S1), Sjöfartsverket prislista and lathund 2026 (S2/S3).'
  document_url: https://www.port.helsingborg.se/wp-content/uploads/2026/04/Tariff-2026.pdf
billers:
- id: port_of_helsingborg
  name: Port of Helsingborg
  description: 'Helsingborgs Hamn AB: port dues, waste/environmental fee, port security fee, cargo dues, stevedoring,
    storage, ancillaries (single biller)'
  currency: SEK
- id: sjofartsverket
  name: Sjöfartsverket
  description: 'Swedish Maritime Administration: national vessel fee (fartygsavgift), readiness fee (beredskapsavgift),
    pilotage (lotsavgift), ordering fee'
  currency: SEK
  frequency_discount:
    id: sfv_frequency_discount
    name: Frequency Discount - Vessel Fee and Readiness Fee
    fee_family: frequency_discount
    apply_families: [vessel_fee, readiness_fee]
    bands:
    - min_calls: 1
      max_calls: 2
      payable_pct: 100
    - min_calls: 3
      max_calls: 3
      payable_pct: 75
    - min_calls: 4
      max_calls: 4
      payable_pct: 50
    - min_calls: 5
      max_calls: 5
      payable_pct: 25
    - min_calls: 6
      max_calls: null
      payable_pct: 0
    source_reference:
      document_name: prislista-farleds-lotsavgifter-2026.pdf
      document_url: docs/sources/sweden/national/sjofartsverket/prislista-farleds-lotsavgifter-2026.pdf
      upstream_url: "https://www-n.sjofartsverket.se/globalassets/tjanster/anlopstjanster/sjofartsverkets-farleds--och-lotsavgifter/prislista-farleds--och-lotsavgifter-2026.pdf"
      page: 4
      clause: Frequency discount
      verified_on: '2026-09-21'
      verified_by: vibe-session-helsingborg
      document_issued: '2025-11-01'
- id: towage_provider
  name: Towage operator (estimated)
  description: Commercial tug services; no published tariff - estimated parameter
  currency: SEK
fee_rules:
- id: poh_port_dues
  fee_family: port_dues
  biller: Port of Helsingborg
  name: Port Dues (Vessels)
  description: Port dues per GT, all vessel types (container model). Flat 6.85 SEK/GT, no banding. Environmental
    discounts are adjustments on this rule (additive stacking per tariff).
  rate_structure:
    type: per_unit
    unit_type: gt
    unit_rate: 6.85
  source_reference:
    document_name: tariff-2026.pdf
    document_url: docs/sources/sweden/helsingborg/port-authority/tariff-2026.pdf
    page: 5
    clause: Port dues, vessels
    verified_on: '2026-09-21'
    verified_by: vibe-session-helsingborg
    document_issued: '2026-01-01'
  adjustments:
  - type: discount
    percentage: 10
    condition: esi_score >= 30 || clean_shipping_index_class == '4'
    stacking_order: 1
    stack_method: additive
    description: 'ESI score >= 30 or Clean Shipping Index class 4: 10% discount on port dues. Note: the port CSI
      discount (Clean Shipping Index class 4, a 1-5 index scale) is a different scale from Sjöfartsverket''s environmental
      class A-E.'
  - type: discount
    percentage: 10
    condition: fossil_free_fuel_percentage >= 30
    stacking_order: 2
    stack_method: additive
    description: '>= 30% fossil-free fuel of annual consumption: additional 10% discount, stacking additively with
      the first (total 20% off).'
- id: poh_long_stay_port_dues
  fee_family: port_dues
  biller: Port of Helsingborg
  name: Long-Stay Additional Port Dues
  description: 'After more than four days in port: 100.00 SEK per commenced metre LOA (non-residential area), per
    7-day period or part thereof, on port dues.'
  rate_structure:
    type: per_commenced_period
    basis: loa
    hours_input: port_time_hours
    fallback_hours: lay_time_hours
    free_hours: 96
    period_hours: 168
    tiers:
    - up_to_excess_hours: null
      rate_per_period_per_basis: 100.0
  source_reference:
    document_name: tariff-2026.pdf
    document_url: docs/sources/sweden/helsingborg/port-authority/tariff-2026.pdf
    page: 5
    clause: Port dues, vessels - additional fee after more than four days
    verified_on: '2026-09-21'
    verified_by: vibe-session-helsingborg
    document_issued: '2026-01-01'
- id: poh_waste_fee
  fee_family: waste
  biller: Port of Helsingborg
  name: Waste and Environmental Fee
  description: 'All vessels: 0.75 SEK per GT, alternatively 25,000 SEK per call; highest of the two applies (assumption
    flagged in the extraction reference section 10: the tariff states the alternative without an explicit selection
    rule; the port''s cruise clause "the option that generates the highest total amount applies" is applied by analogy;
    break-even at 33,333 GT - vessels below pay the flat 25,000 SEK). Includes sorted waste and up to 10 m3 sludge
    per call.'
  rate_structure:
    type: banded_flat
    basis: gt
    bands:
    - min: null
      max: 33333
      amount: 25000
    - min: 33333
      max: null
      rate: 0.75
  source_reference:
    document_name: tariff-2026.pdf
    document_url: docs/sources/sweden/helsingborg/port-authority/tariff-2026.pdf
    page: 5
    clause: Waste and environmental fee
    verified_on: '2026-09-21'
    verified_by: vibe-session-helsingborg
    document_issued: '2026-01-01'
- id: poh_sludge_excess
  fee_family: waste
  biller: Port of Helsingborg
  name: Additional Sludge (above 10 m3)
  description: 'Sludge above 10 m3 per call: 2,075.00 SEK per m3 plus 15 percent administration fee (actual-cost
    basis for scrubber waste). Optional call input, default 0.'
  rate_structure:
