- id: poh_ees
  fee_family: environmental_surcharge
  biller: Port of Helsingborg
  name: Emergency Energy Surcharge (EES)
  description: 'Emergency Energy Surcharge on all container units handled over quay. Variable, adjusted monthly
    on the prior-month average HVO (Neste MY Renewable Diesel) price band table (SEK per move): HVO <= 16 -> 0;
    16.01-20 -> 15; 20.01-24 -> 35; 24.01-28 -> 55; 28.01-32 -> 75; 32.01-36 -> 95. Current level September 2026:
    35 SEK per move (verified on the port tariff page 2026-09-21). Datestamped parameter: the rate applies from
    its reference date until superseded by the port''s next monthly publication.'
  rate_structure:
    type: per_unit
    unit_type: move
    unit_rate: 35
    unit_rate_input: ees_rate_per_move
  source_reference:
