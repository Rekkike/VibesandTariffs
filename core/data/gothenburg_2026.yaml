  # --- Yard Storage (ladder form, spec v0.2.33) ---
  # Free time is an explicit zero-rate band, matching the shape the engine
  # test pins and the tariff's own schedule: Export/Transhipment 0-6 free,
  # 7-9 at 133, 10-13 at 346, >13 at 578; Import/Domestic 0-4 free, 5-7 at
  # 133, 8-11 at 346, >11 at 578.
  - id: apm_terminals_storage_export
    fee_family: storage
    biller: APM Terminals Gothenburg
    name: Yard Storage - Export/Transhipment
    description: "Yard storage for export/transhipment units per calendar day: days 0-6 free, 7-9 at 133, 10-13 at 346, >13 at 578"
    rate_structure:
      type: banded_by_time
      basis: storage_days_export
      bands:
        - min_days: 0
          max_days: 6
          daily_rate: 0
        - min_days: 7
