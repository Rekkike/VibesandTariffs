      verified_on: "2026-09-21"
      verified_by: "Gothenburg repair pass (INTENDED_STATE 2.1)"

  # Fresh water: below 50 m3 0 SEK; above 50 m3 50 SEK per m3
  - id: port_gothenburg_fresh_water
    fee_family: ancillary_service
    biller: Port of Gothenburg
    name: Fresh Water Supply
    description: "Fresh water: 0 SEK up to 50 m3; 50 SEK per m3 above 50 m3"
    rate_structure:
      type: banded_flat
      basis: fresh_water_m3
      bands:
        - min: null
          max: 50
          amount: 0
        - min: 50
          max: null
          rate: 50
          cap_at_max: false
    applicable_conditions:
