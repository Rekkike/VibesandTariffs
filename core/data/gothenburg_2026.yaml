      document_issued: "2025-12-01"
      page: 10
      clause: "Section 4.1 - Waste Dues, scrubber waste"
      verified_on: "2026-09-21"
      verified_by: "Gothenburg repair pass (INTENDED_STATE 2.1)"

  # Break bulk scrap rate (APM Terminals, charge on goods): base rate only;
