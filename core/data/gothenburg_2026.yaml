# Port of Gothenburg 2026 Tariff
# Complete data file for Port Call Cost Analyzer
# All amounts in SEK

metadata:
  id: gothenburg
  name: Port of Gothenburg
  country: Sweden
  currency: SEK
  validity_start: "2026-01-01"
  validity_end: "2026-12-31"
  description: "Complete tariff data for Gothenburg port including Port of Gothenburg, Sjöfartsverket, and APM Terminals"

billers:
  - id: port_of_gothenburg
    name: Port of Gothenburg
    description: "Port authority for Gothenburg"
    currency: SEK

  - id: sjofartsverket
    name: Sjöfartsverket
    description: "Swedish Maritime Administration (national authority)"
    currency: SEK
    frequency_discount:
      id: sjofartsverket_frequency_discount
      name: Frequency Discount - Vessel Fee and Readiness Fee
      fee_family: frequency_discount
      apply_families: [vessel_fee, readiness_fee]
      bands:
        - min_calls: 1
          max_calls: 2
          payable_pct: 100
        - min_calls: 3
          max_calls: 3
          payable_pct: 75
        - min_calls: 4
          max_calls: 4
          payable_pct: 50
        - min_calls: 5
          max_calls: 5
          payable_pct: 25
        - min_calls: 6
          max_calls: null
          payable_pct: 0
      source_reference:
        document_name: "prislista-farleds-lotsavgifter-2026.pdf"
        document_url: "docs/sources/sweden/national/sjofartsverket/prislista-farleds-lotsavgifter-2026.pdf"
        upstream_url: "https://www-n.sjofartsverket.se/globalassets/tjanster/anlopstjanster/sjofartsverkets-farleds--och-lotsavgifter/prislista-farleds--och-lotsavgifter-2026.pdf"
        document_issued: "2025-11-01"
        page: 4
        clause: "Frequency discount on fartygsavgift and beredskapsavgift"
        verified_on: "2025-12-10"
        verified_by: "Port Cost Analyzer Team"

  - id: apm_terminals_gothenburg
    name: APM Terminals Gothenburg
    description: "Terminal operator at Port of Gothenburg"
    currency: SEK
  - id: towage_provider
    name: Towage operator (estimated)
    description: "Commercial tug services at Port of Gothenburg; no published tariff - estimated parameter (spec v0.2.33)"
    currency: SEK

# ============================================================================
# PORT OF GOTHENBURG FEES
# ============================================================================

fee_rules:
  # --- Container Vessel Dues (Progressive by GT) ---
  - id: port_gothenburg_container_vessel_dues
    fee_family: port_dues
    biller: Port of Gothenburg
    name: Container Vessel Dues
    description: "Progressive dues based on vessel GT for container vessels"
    rate_structure:
      type: progressive
      basis: gt
      bands:
        - min: 0
          max: 20000
          rate: 1.96
        - min: 20000
          max: 40000
          rate: 1.71
        - min: 40000
          max: 60000
          rate: 1.15
        - min: 60000
          max: null
          rate: 0.80
    minimum: 500
    adjustments:
      - type: discount
        percentage: 10
        condition: "esi_score >= 30 || clean_shipping_index_class == '4'"
        description: "Environmental discount for ESI >= 30 or CSI class 4"
        stack_method: additive
        stacking_order: 1
      - type: discount
        percentage: 10
        condition: "fossil_free_fuel_percentage >= 30"
        description: "Environmental discount for >= 30% fossil-free fuel bunkered in Gothenburg"
        stack_method: additive
        stacking_order: 2
      - type: discount
        percentage: 50
        condition: "calls_this_month >= 2 && got_same_route_second_call"
        description: "Frequency discount: 50% on GT-based port dues for the second call on the same route (import call and export call pair; requires the explicit same-route attestation)"
        stacking_order: 3
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      upstream_url: "https://www.portofgothenburg.com/globalassets/dokument/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 9
      clause: "Section 2.2 - Container Vessels (port infrastructure dues)"
      verified_on: "2026-09-27"
      verified_by: "Port Cost Analyzer Team"

  # --- Environmental and Frequency Discounts on Port Dues ---
  # Encoded as adjustments on the container vessel dues rule above:
  # ESI >= 30 or CSI class 4 -> 10%; >= 30% fossil-free fuel -> +10% (additive
  # per the tariff's 10 + 10 wording); second call on the same route -> 50%
  # (port-tariff-2026.pdf §2.2 FREQUENCY DISCOUNT, p.10: "Scheduled shipping
  # routes with calls at the Port of Gothenburg twice on the same route
  # (import call and export call) are entitled to a 50% discount on port dues
  # based on GT for the second call" — spec v0.2.67: gated on the explicit
  # got_same_route_second_call attestation, so two unrelated calls in a
  # calendar month never earn it; the mis-citation "Sections 3.2-3.3" is
  # corrected here against the live G1 document).
  # Waste dues (spec v0.2.50): the tariff's split dimension is the arrival
  # origin — the previous port of call's region — never the flag. G1 waste
  # schedule: "Vessels arriving from European ports 0,13 SEK/GT / Vessels
  # arriving from non-European ports 0,24 SEK/GT; Discount with certificates
  # -0,05 SEK/GT" (EU Implementing Regulation 2022/91 certification), sludge
  # "Sludge from vessels arriving from European ports, up to 11 m³ 0,21 SEK/GT
  # / Sludge from vessels arriving from non-European ports 0,31 / Sludge
  # exceeding 11 m³ 2 400 SEK/m³". Compulsory per Swedish legislation (§6:
  # "The Port of Gothenburg charges for receiving waste from vessels in
  # accordance with Swedish legislation"); only the Transport Agency exemption
  # relieves it (§12).
  - id: port_gothenburg_waste_solid_eu
    fee_family: waste
    biller: Port of Gothenburg
    name: Solid Waste Dues - Arrival from Europe
    description: "Solid waste dues for vessels arriving from a European port (previous port of call): 0.13 SEK/GT, compulsory for all calling vessels per Swedish legislation"
    rate_structure:
      type: per_unit
      unit_rate: 0.13
      unit_type: gt
    applicable_conditions:
      arrival_origin: europe
    adjustments:
      - type: discount
        amount_per_gt: 0.05
        condition: "waste_certificate_2022_91"
        description: "EU 2022/91 waste-certificate discount (tariff §10): -0.05 SEK/GT off the solid-waste line for certified vessels"
        stack_method: additive
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      upstream_url: "https://www.portofgothenburg.com/globalassets/dokument/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 10
      clause: "Waste dues schedule, solid waste — 'Vessels arriving from European ports 0,13 SEK/GT'; certificate discount §10"
      verified_on: "2026-09-24"
      verified_by: "Gothenburg waste-dues origin pass (spec v0.2.50)"

  - id: port_gothenburg_waste_solid_non_eu
    fee_family: waste
    biller: Port of Gothenburg
    name: Solid Waste Dues - Arrival from outside Europe
    description: "Solid waste dues for vessels arriving from a non-European port (previous port of call): 0.24 SEK/GT, compulsory for all calling vessels per Swedish legislation"
    rate_structure:
      type: per_unit
      unit_rate: 0.24
      unit_type: gt
    applicable_conditions:
      arrival_origin: outside-europe
    adjustments:
      - type: discount
        amount_per_gt: 0.05
        condition: "waste_certificate_2022_91"
        description: "EU 2022/91 waste-certificate discount (tariff §10): -0.05 SEK/GT off the solid-waste line for certified vessels"
        stack_method: additive
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      upstream_url: "https://www.portofgothenburg.com/globalassets/dokument/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 10
      clause: "Waste dues schedule, solid waste — 'Vessels arriving from non-European ports 0,24 SEK/GT'; certificate discount §10"
      verified_on: "2026-09-24"
      verified_by: "Gothenburg waste-dues origin pass (spec v0.2.50)"

  # Sludge: arrival from Europe 0.21 SEK/GT up to 11 m³ then 2,400 SEK/m³
  - id: port_gothenburg_waste_sludge_eu
    fee_family: waste
    biller: Port of Gothenburg
    name: Sludge Waste Dues - Arrival from Europe
    description: "Sludge dues for vessels arriving from a European port (previous port of call): 0.21 SEK/GT up to 11 m³, then 2,400 SEK/m³; compulsory for all calling vessels per Swedish legislation"
    rate_structure:
      type: banded
      basis: gt
      bands:
        - min: 0
          max: null
          rate: 0.21
    # Note: the 11 m³ threshold and 2,400 SEK/m³ excess is carried by the
    # dedicated excess rule below (presence-gated on sludge_extra_m3).
    applicable_conditions:
      arrival_origin: europe
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      upstream_url: "https://www.portofgothenburg.com/globalassets/dokument/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 10
      clause: "Waste dues schedule, sludge — 'Sludge from vessels arriving from European ports, up to 11 m³ 0,21 SEK/GT'"
      verified_on: "2026-09-24"
      verified_by: "Gothenburg waste-dues origin pass (spec v0.2.50)"

  - id: port_gothenburg_waste_sludge_non_eu
    fee_family: waste
    biller: Port of Gothenburg
    name: Sludge Waste Dues - Arrival from outside Europe
    description: "Sludge dues for vessels arriving from a non-European port (previous port of call): 0.31 SEK/GT up to 11 m³, then 2,400 SEK/m³; compulsory for all calling vessels per Swedish legislation"
    rate_structure:
      type: banded
      basis: gt
      bands:
        - min: 0
          max: null
          rate: 0.31
    applicable_conditions:
      arrival_origin: outside-europe
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      upstream_url: "https://www.portofgothenburg.com/globalassets/dokument/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 10
      clause: "Waste dues schedule, sludge — 'Sludge from vessels arriving from non-European ports, up to 11 m³ 0,31 SEK/GT'"
      verified_on: "2026-09-24"
      verified_by: "Gothenburg waste-dues origin pass (spec v0.2.50)"

  # --- OPS Connection Fee ---
  # Sludge exceeding the included 11 m3: 2,400 SEK per m3
  - id: port_gothenburg_waste_sludge_excess
    fee_family: waste
    biller: Port of Gothenburg
    name: Sludge Waste Dues - Excess Volume
    description: "Sludge disposal fee per m3 exceeding the 11 m3 included volume"
    rate_structure:
      type: per_unit
      unit_rate: 2400
      unit_type: sludge_extra_m3
    applicable_conditions:
      sludge_extra_m3: 'present'
    source_reference:
