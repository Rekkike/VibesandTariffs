      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      upstream_url: "https://www.portofgothenburg.com/globalassets/dokument/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 11
      clause: "Section 4.2 - Fresh Water"
      verified_on: "2026-09-21"
      verified_by: "Gothenburg repair pass (INTENDED_STATE 2.1)"

  # Scrubber waste: 800 SEK administration fee; actual disposal cost not encoded
  - id: port_gothenburg_waste_scrubber
    fee_family: waste
    biller: Port of Gothenburg
    name: Scrubber Waste Disposal - Administration
    description: "Scrubber waste administration fee; actual disposal cost billed separately and not encoded"
    rate_structure:
