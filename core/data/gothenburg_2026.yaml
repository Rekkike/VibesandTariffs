# Port of Gothenburg 2026 Tariff
# Complete data file for Port Call Cost Analyzer
# All amounts in SEK

metadata:
  id: gothenburg
  name: Port of Gothenburg
  country: Sweden
  currency: SEK
  validity_start: "2026-01-01"
  validity_end: "2026-12-31"
  description: "Complete tariff data for Gothenburg port including Port of Gothenburg, Sjöfartsverket, and APM Terminals"

billers:
  - id: port_of_gothenburg
    name: Port of Gothenburg
    description: "Port authority for Gothenburg"
    currency: SEK

  - id: sjofartsverket
    name: Sjöfartsverket
    description: "Swedish Maritime Administration (national authority)"
    currency: SEK

  - id: apm_terminals_gothenburg
    name: APM Terminals Gothenburg
    description: "Terminal operator at Port of Gothenburg"
    currency: SEK

# ============================================================================
# PORT OF GOTHENBURG FEES
# ============================================================================

fee_rules:
  # --- Container Vessel Dues (Progressive by GT) ---
  - id: port_gothenburg_container_vessel_dues
    fee_family: port_dues
    biller: Port of Gothenburg
    name: Container Vessel Dues
    description: "Progressive dues based on vessel GT for container vessels"
    rate_structure:
      type: progressive
      basis: gt
      bands:
        - min: 0
          max: 20000
          rate: 1.96
        - min: 20000
          max: 40000
          rate: 1.71
        - min: 40000
          max: 60000
          rate: 1.15
        - min: 60000
          max: null
          rate: 0.80
    minimum: 500
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 5
      clause: "Section 2.1 - Container Vessel Dues"
      verified_on: "2025-12-15"
      verified_by: "Port Cost Analyzer Team"

  # --- Environmental Discounts on Port Dues ---
  # ESI score >= 30 or CSI class 4 -> 10% discount
  - id: port_gothenburg_env_discount_esi_csi
    fee_family: environmental_surcharge
    biller: Port of Gothenburg
    name: Environmental Discount - ESI/CSI
    description: "10% discount on port dues for ESI score >= 30 or CSI class 4"
    rate_structure:
      type: flat
      amount: 0
    adjustments:
      - type: discount
        percentage: 10
        condition: "esi_score >= 30 || csi_class == '4'"
        description: "Environmental discount for ESI >= 30 or CSI class 4"
        stacking_order: 1
    applicable_conditions:
      esi_score: 30
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 7
      clause: "Section 3.2 - Environmental Discounts"
      verified_on: "2025-12-15"
      verified_by: "Port Cost Analyzer Team"

  # >= 30% fossil-free fuel bunkered -> additional 10% discount
  - id: port_gothenburg_env_discount_fuel
    fee_family: environmental_surcharge
    biller: Port of Gothenburg
    name: Environmental Discount - Fossil-Free Fuel
    description: "Additional 10% discount on port dues for >= 30% fossil-free fuel bunkered in Gothenburg"
    rate_structure:
      type: flat
      amount: 0
    adjustments:
      - type: discount
        percentage: 10
        condition: "fossil_free_fuel_percentage >= 30"
        description: "Environmental discount for >= 30% fossil-free fuel"
        stacking_order: 2
    applicable_conditions:
      fuel_percentage: 30
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 7
      clause: "Section 3.2 - Environmental Discounts"
      verified_on: "2025-12-15"
      verified_by: "Port Cost Analyzer Team"

  # --- Frequency Discount on Port Dues ---
  # 50% discount for second call on same route within discount window
  - id: port_gothenburg_frequency_discount
    fee_family: port_dues
    biller: Port of Gothenburg
    name: Frequency Discount
    description: "50% discount on port dues for second call on same route within discount window"
    rate_structure:
      type: flat
      amount: 0
    adjustments:
      - type: discount
        percentage: 50
        condition: "calls_this_month >= 2"
        description: "Frequency discount for multiple calls"
        stacking_order: 3
    applicable_conditions:
      calls_this_month: 2
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 8
      clause: "Section 3.3 - Frequency Discounts"
      verified_on: "2025-12-15"
      verified_by: "Port Cost Analyzer Team"

  # --- Waste Dues ---
  # Solid waste: EU vessel 0.13 SEK/GT, non-EU 0.24 SEK/GT
  - id: port_gothenburg_waste_solid_eu
    fee_family: waste
    biller: Port of Gothenburg
    name: Solid Waste Dues - EU Vessel
    description: "Solid waste disposal fee for EU-flagged vessels"
    rate_structure:
      type: per_unit
      unit_rate: 0.13
      unit_type: gt
    applicable_conditions:
      flag_state: EU
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 10
      clause: "Section 4.1 - Waste Dues"
      verified_on: "2025-12-15"
      verified_by: "Port Cost Analyzer Team"

  - id: port_gothenburg_waste_solid_non_eu
    fee_family: waste
    biller: Port of Gothenburg
    name: Solid Waste Dues - Non-EU Vessel
    description: "Solid waste disposal fee for non-EU flagged vessels"
    rate_structure:
      type: per_unit
      unit_rate: 0.24
      unit_type: gt
    applicable_conditions:
      flag_state: non-EU
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 10
      clause: "Section 4.1 - Waste Dues"
      verified_on: "2025-12-15"
      verified_by: "Port Cost Analyzer Team"

  # Sludge: EU vessel 0.21 SEK/GT up to 11 m³ then 2,400 SEK/m³
  - id: port_gothenburg_waste_sludge_eu
    fee_family: waste
    biller: Port of Gothenburg
    name: Sludge Waste Dues - EU Vessel
    description: "Sludge waste disposal fee for EU-flagged vessels: 0.21 SEK/GT up to 11 m³, then 2,400 SEK/m³"
    rate_structure:
      type: banded
      basis: gt
      bands:
        - min: 0
          max: null
          rate: 0.21
    # Note: The 11 m³ threshold and 2,400 SEK/m³ excess would need custom logic
    # For now, using per-GT rate as base
    applicable_conditions:
      flag_state: EU
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 10
      clause: "Section 4.2 - Sludge Waste Dues"
      verified_on: "2025-12-15"
      verified_by: "Port Cost Analyzer Team"

  - id: port_gothenburg_waste_sludge_non_eu
    fee_family: waste
    biller: Port of Gothenburg
    name: Sludge Waste Dues - Non-EU Vessel
    description: "Sludge waste disposal fee for non-EU flagged vessels: 0.31 SEK/GT up to 11 m³, then 2,400 SEK/m³"
    rate_structure:
      type: banded
      basis: gt
      bands:
        - min: 0
          max: null
          rate: 0.31
    applicable_conditions:
      flag_state: non-EU
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 10
      clause: "Section 4.2 - Sludge Waste Dues"
      verified_on: "2025-12-15"
      verified_by: "Port Cost Analyzer Team"

  # --- OPS Connection Fee ---
  - id: port_gothenburg_ops_connection
    fee_family: connection_fee
    biller: Port of Gothenburg
    name: OPS Connection Fee
    description: "Onshore Power Supply connection fee"
    rate_structure:
      type: flat
      amount: 7000
    applicable_conditions:
      ops_usage: true
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 12
      clause: "Section 5.1 - OPS Connection"
      verified_on: "2025-12-15"
      verified_by: "Port Cost Analyzer Team"

  # --- Lay-up Fee ---
  - id: port_gothenburg_layup
    fee_family: lay_up
    biller: Port of Gothenburg
    name: Lay-up Fee
    description: "Lay-up fee per metre LOA per commenced day"
    rate_structure:
      type: per_commenced_day
      daily_rate: 45
      basis: lay_up_days
    source_reference:
      document_name: "port-tariff-2026.pdf"
      document_url: "docs/sources/sweden/gothenburg/port-authority/port-tariff-2026.pdf"
      document_issued: "2025-12-01"
      page: 13
      clause: "Section 5.2 - Lay-up Fees"
      verified_on: "2025-12-15"
      verified_by: "Port Cost Analyzer Team"

