      verified_on: "2026-09-21"
      verified_by: "Gothenburg repair pass (INTENDED_STATE 2.1)"

  - id: port_gothenburg_ops_connection
    fee_family: connection_fee
    biller: Port of Gothenburg
    name: OPS Connection Fee
    description: "Onshore Power Supply connection fee - tanker segment only (jetties 519/520/521), NOT for container terminals"
    rate_structure:
