  # Terminal scope (spec v0.2.49): these items apply only to Eurogate calls.
  # ==========================================================================
  - id: eurogate_berthing_charge
    fee_family: vessel_fee
    biller: EUROGATE Container Terminal Hamburg
    name: Berthing Charge / Tonnage Dues
    description: "Eurogate berthing charge (vessel charge ch. 2): every ship berthed at the handling facilities pays a berthing charge based on GT and lay time - 1.04 EUR/GT for the first 24 h of lay days, then 0.60 EUR/GT per commenced 12 h or part. Lay time runs docking to casting off, calculated uninterruptedly (S9 2.1.1-2.1.2). Ship's dues are billed separately from handling (ch. 5) - verdict two, spec v0.2.49."
    rate_structure:
      type: tiered_per_period
      basis: gt
      hours_input: lay_time_hours
      initial_tier:
        hours: 24
        rate_per_basis: 1.04
      subsequent_tier:
        period_hours: 12
        rate_per_basis: 0.60
    applicable_conditions:
      terminal_operator: Eurogate
    source_reference:
      document_name: "prices-and-conditions-2026.pdf"
      document_url: "docs/sources/germany/hamburg/eurogate/prices-and-conditions-2026.pdf"
