# Hamburg 2026 port file - Port Call Cost Analyzer
# Extraction authority: docs/sources/germany/hamburg/HAMBURG_EXTRACTION_REFERENCE.md
# All amounts in EUR. Billers: HPA, GDWS, HHLA, EUROGATE, City of Hamburg (BUKEA).
# Terminal scope (spec v0.2.49): a Hamburg call is priced against a named terminal
# operator. HHLA ship's-dues and terminal items apply only to HHLA calls (default);
# EUROGATE items only to Eurogate calls. Port-wide charges (HPA, GDWS, BUKEA, towage)
# are operator-neutral. S5/S6 terms-only documents not archived - live upstream URLs
# in the extraction reference.

metadata:
  id: hamburg
  name: Port of Hamburg
  country: Germany
  currency: EUR
  validity_start: "2026-01-01"
  validity_end: "2026-12-31"
  description: "Hamburg port call costs: HPA port fee (cat. 31), GDWS pilotage (River Elbe), HHLA Quay Tariff, and the City of Hamburg ship waste fee (BUKEA). Handling and towage are estimated parameters (unpublished rates)."

billers:
  - id: hpa
    name: HPA (Hamburg Port Authority)
    description: "Port authority: port fee, demurrage, HPA berth fees"
    currency: EUR
  - id: gdws
    name: GDWS (Federal) via pilot station
    description: "Federal pilotage dues and pilot fees, River Elbe"
    currency: EUR
  - id: hhla
    name: HHLA Container Terminals
    description: "HHLA Container Terminal Burchardkai/Altenwerder/Tollerort - one published Quay Tariff (Kaitarif) for all three terminals"
    currency: EUR
    surcharge:
      id: hhla_hafenfonds_surcharge
      name: Hafenfonds Surcharge
      fee_family: hafenfonds
      percentage: 1.5
      exclude_families:
        - storage
        - terminal_handling
      source_reference:
        document_name: "quay-tariff-2026.pdf"
        document_url: "docs/sources/germany/hamburg/hhla/quay-tariff-2026.pdf"
        document_issued: "2025-11-27"
        page: 16
        clause: "9.2.3"
        verified_on: "2026-09-21"
        verified_by: "vibe-session-hamburg"
  - id: city_of_hamburg_bukea
    name: City of Hamburg (BUKEA)
    description: "Free and Hanseatic City of Hamburg - Environment, Climate, Energy and Agriculture Authority (BUKEA); municipal ship waste fee under HmbSchEG 2022 / EU PRF Directive 2019/883"
    currency: EUR
  - id: eurogate
    name: EUROGATE Container Terminal Hamburg
    description: "EUROGATE Hamburg - published Prices and Conditions (effective 01.03.2026): berthing charge/tonnage dues, waterside container handling, security, social-fund surcharge (spec v0.2.49 terminal scope)"
    currency: EUR
    surcharge:
      id: eurogate_social_fund_surcharge
      name: Social Fund Surcharge
      fee_family: social_fund
      percentage: 1.5
      exclude_families:
        - storage
        - terminal_handling
        - security
      source_reference:
        document_name: "prices-and-conditions-2026.pdf"
        document_url: "docs/sources/germany/hamburg/eurogate/prices-and-conditions-2026.pdf"
        document_issued: "2026-01-01"
        page: 2
        clause: "1.3.13"
        verified_on: "2026-09-24"
        verified_by: "vibe-session-hamburg-terminal-scope"

fee_rules:
  # ==========================================================================
  # HPA - Price Category 31 (Container Ships)
  # ==========================================================================
  - id: hpa_port_fee
    fee_family: port_dues
    biller: HPA (Hamburg Port Authority)
    name: Port Fee (Hafengeld)
    description: "HPA price category 31 container ship fee: GT and environmental components, cumulative tranches over GT (half-open bands, lower exclusive / upper inclusive). Covers up to 120 h in port. GT above 225,000 GT is not chargeable. Minimum 43.56 EUR per chargeable call."
    rate_structure:
      type: composite_tranche
      basis: gt
      gt_cap: 225000
      tranches:
        - min: null
          max: 20000
          components:
            gt: 0.0856
            env: 0.0214
        - min: 20000
          max: 100000
          components:
            gt: 0.2981
            env: 0.0746
        - min: 100000
          max: null
          components:
            gt: 0.2485
            env: 0.0621
      component_adjustments:
        env:
          # 1. Tier surcharge/reduction (S1 item 115; STC 2.1.1 tier basis: most polluting engine, IAPP proof)
          - kind: tier_pct
            map:
              "Tier 0": 30
              "Tier I": 25
              "Tier II": 5
              "Tier III": -20
          # 2. ESI air discount on the tier-adjusted env subtotal (S2 4.1.1.1)
          - kind: score_discount_pct_with_cap
            input: esi_score
            description: "ESI air"
            bands:
              - { min: 20, max: 25, pct: 0.35, cap: 175 }
              - { min: 25, max: 35, pct: 0.7, cap: 350 }
              - { min: 35, max: 50, pct: 3.5, cap: 700 }
              - { min: 50, max: null, pct: 7, cap: 1050 }
          # 3. ESI noise discount, separate (S2 4.1.1.2)
          - kind: score_discount_pct_with_cap
            input: esi_noise_score
            description: "ESI noise"
            bands:
              - { min: 40, max: 45, pct: 0.15, cap: 75 }
              - { min: 45, max: 55, pct: 0.3, cap: 150 }
              - { min: 55, max: 70, pct: 1.5, cap: 300 }
              - { min: 70, max: null, pct: 3, cap: 450 }
        gt:
          # 2. OPS rebate (S1 item 217), applied to capped GT
          - kind: per_gt_rebate
            rate_per_gt: 0.015
            condition_input: ops_usage
            description: "OPS rebate"
          # 3. Quantum discount on the OPS-adjusted GT subtotal (S2 4.1.2.11)
          - kind: pct_discount_banded
            input: quantum_prior_year_gt
            description: "Quantum"
            bands:
              - { min: 1500000, max: 10000000, pct: 2.5 }
              - { min: 10000000, max: 25000000, pct: 5.0 }
              - { min: 25000000, max: null, pct: 7.5 }
      component_labels:
        gt: "GT component"
        env: "Environmental component"
    minimum: 43.56
    source_reference:
      document_name: "pricelist-maritime-shipping-2026.pdf"
      document_url: "docs/sources/germany/hamburg/port-authority/pricelist-maritime-shipping-2026.pdf"
      document_issued: "2025-12-18"
      page: 6
      clause: "cat. 31 item A; item 115 (Tier); item 210 (cap); item 217 (OPS)"
      verified_on: "2026-09-21"
      verified_by: "vibe-session-hamburg"

  - id: hpa_demurrage
    fee_family: lay_up
    biller: HPA (Hamburg Port Authority)
    name: Demurrage
    description: "HPA demurrage beyond the port fee's 120 h coverage: 0.0165 EUR/GT per commenced 12 h of excess (up to 120 h excess) or 0.0255 EUR/GT per commenced 12 h beyond that. Minimum 44.38 EUR."
    rate_structure:
      type: per_commenced_period
      basis: gt
      hours_input: port_time_hours
      fallback_hours: lay_time_hours
      free_hours: 120
      period_hours: 12
      tiers:
        - up_to_excess_hours: 120
          rate_per_period_per_basis: 0.0165
        - up_to_excess_hours: null
          rate_per_period_per_basis: 0.0255
    minimum: 44.38
    source_reference:
      document_name: "pricelist-maritime-shipping-2026.pdf"
      document_url: "docs/sources/germany/hamburg/port-authority/pricelist-maritime-shipping-2026.pdf"
      document_issued: "2025-12-18"
      page: 7
      clause: "cat. 31 item B"
      verified_on: "2026-09-21"
      verified_by: "vibe-session-hamburg"

  - id: hpa_berth_fee_quay
    fee_family: idle_berth
    biller: HPA (Hamburg Port Authority)
    name: HPA Berth Fee (Quay)
    description: "HPA-operated quay berth fee: 0.0152 EUR/GT per commenced 6 h. Not charged at terminal berths (off by default). Minimum 16.84 EUR per docking per 6 h."
    applicable_conditions:
      hpa_berth_usage: true
      berth_type: quay
    rate_structure:
      type: per_commenced_period
      basis: gt
      hours_input: berth_hours
      free_hours: 0
      period_hours: 6
      minimum_per_period: 16.84
      tiers:
        - up_to_excess_hours: null
          rate_per_period_per_basis: 0.0152
    minimum: 16.84
    source_reference:
      document_name: "pricelist-maritime-shipping-2026.pdf"
      document_url: "docs/sources/germany/hamburg/port-authority/pricelist-maritime-shipping-2026.pdf"
      document_issued: "2025-12-18"
      page: 7
      clause: "cat. 31 item C"
      verified_on: "2026-09-21"
      verified_by: "vibe-session-hamburg"

  - id: hpa_berth_fee_dolphins
    fee_family: idle_berth
    biller: HPA (Hamburg Port Authority)
    name: HPA Berth Fee (Dolphins)
    description: "HPA-operated dolphins berth fee: 0.0052 EUR/GT per commenced 6 h. Not charged at terminal berths (off by default). Minimum 16.84 EUR per docking per 6 h."
    applicable_conditions:
      hpa_berth_usage: true
      berth_type: dolphins
    rate_structure:
      type: per_commenced_period
      basis: gt
      hours_input: berth_hours
      free_hours: 0
      period_hours: 6
      minimum_per_period: 16.84
      tiers:
        - up_to_excess_hours: null
          rate_per_period_per_basis: 0.0052
    minimum: 16.84
    source_reference:
      document_name: "pricelist-maritime-shipping-2026.pdf"
      document_url: "docs/sources/germany/hamburg/port-authority/pricelist-maritime-shipping-2026.pdf"
      document_issued: "2025-12-18"
      page: 7
      clause: "cat. 31 item C"
      verified_on: "2026-09-21"
      verified_by: "vibe-session-hamburg"

