  # --- Storage of units (S1 p.16) - the scenario surface (Eurogate ch. 7 pattern) ---
  # Vessel-arriving units: day of arrival + 3 working days free (free through
  # day 4; the tariff's own bands start at day 5-6), then the per-size daily
  # bands. Encoded per size via the Helsingborg progressive_daily shape
  # (container_count_input per bucket); the tariff's per-TEU 13.50 SEK/day
  # line and the train/truck-arriving and empty-unit tables are recorded in
  # the extraction reference (the empty-table assignment is ambiguous in the
  # extracted text - recorded, never guessed). Storage days are the user's
  # scenario input; the seeded defaults sit inside the free time.
  - id: pon_storage_import_20ft
    fee_family: storage
    biller: Port of Norrköping
    name: Storage Import Units 20ft (scenario)
    description: 'Storage of import units arriving with vessel: day of arrival + 3 working days free, day 5-6 at 103 SEK per day per 20'' unit, day 7 and above at 253 SEK per day. Scenario surface - fires only when storage days are entered beyond the free time; blank renders no line.'
    rate_structure:
      type: progressive_daily
      days_input: storage_days_import
      container_count_input: containers_discharged_le20ft
      free_days: 4
      bands:
        - min_days: 1
          max_days: 2
          rate_per_container_per_day: 103
        - min_days: 3
          max_days: null
          rate_per_container_per_day: 253
    scenario_adjusted:
      description: 'scenario-derived figure - the storage-day count is the user''s scenario input over the pinned tariff schedule; never tariff-transcribed usage'
      severity: info
    source_reference:
      document_name: tariff-2026-v2.pdf
      document_url: docs/sources/sweden/norrkoping/tariff-2026-v2.pdf
      page: 16
      clause: STORAGE OF UNITS - IMPORT UNITS ARRIVING WITH VESSEL - Day 5-6 103 SEK per day (20' container), Day 7- 253 SEK per day
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-01-01'

  - id: pon_storage_import_40ft
    fee_family: storage
