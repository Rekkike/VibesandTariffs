      type: flat
      amount: 0
    service_gap_notice:
      description: 'Sludge fee: announced in the tariff''s waste section but no published figure exists in the document (Tariff 2026 Version 2, p.7). The call''s total excludes any sludge charge - the figure, if any, is the port''s own quote, never estimated or tariff-derived.'
