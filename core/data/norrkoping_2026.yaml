  # --- Linemen: outsourced, no published rate (service gap notice) ---
  - id: pon_linemen_notice
    fee_family: mooring
    biller: Frakt & Trosstjänst (linemen)
    name: Linemen (boatmen) - outsourced, no published rate (notice)
    description: 'The tariff''s LINEMEN & TUG SERVICES section names Frakt & Trosstjänst (frakotross.se) as the outsourced linemen provider and publishes no rate. The service is billed by the provider separately from the port tariff; this call''s total EXCLUDES the linemen cost; this line is a notice only and adds nothing to any total.'
    rate_structure:
      type: flat
      amount: 0
    service_gap_notice:
      description: 'Linemen at Norrköping are a separately-billed outsourced service (Frakt & Trosstjänst per the tariff''s own outsourcing sentence) with no published rate in this tariff. The call''s total excludes it - the figure, if any, is the user''s own entry or the provider''s quote, never estimated or tariff-derived.'
