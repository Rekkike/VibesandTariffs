      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-01-01'

  - id: pon_sludge_gap_notice
    fee_family: waste
    biller: Port of Norrköping
    name: Sludge Fee (no published figure - notice)
    description: 'The tariff''s waste section announces a SLUDGE FEE but publishes no figure anywhere in the extracted document. The sludge surface is a gap: the model expects a rate, the document does not publish one, and no figure is invented. A verified figure from the port would enter as a data correction.'
