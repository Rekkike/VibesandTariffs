  # --- Towage (estimated; SVITZER named, no published rate) ---
  - id: pon_towage_estimate
    fee_family: towage
    biller: Towage operator (estimated)
    name: Towage (estimated)
    description: 'Towage per tug-assist. The tariff names SVITZER (svitzer.com) as the outsourced tug provider and publishes no rate. Declared estimate 60,000 SEK per tug-assist; user-editable. Default tug count by LOA class (spec 3.3, defaults are data, user-overridable): LOA < 150 m: 0 tugs; 150-250 m: 1; > 250 m: 2.'
    rate_structure:
      type: per_unit
      unit_type: tug_count
      unit_rate: 60000
      unit_rate_input: towage_cost_per_tug
      default_by_loa:
        bands:
          - max_m: 150
            count: 0
            description: 'LOA < 150 m: 0 tugs'
          - min_m: 150
            max_m: 250
            count: 1
            description: '150-250 m: 1 tug'
          - min_m: 250
            count: 2
            description: '> 250 m: 2 tugs'
    source_reference:
      document_name: NORRKOPING_EXTRACTION_REFERENCE.md
      document_url: docs/sources/sweden/norrkoping/NORRKOPING_EXTRACTION_REFERENCE.md
      page: 5
      clause: 5 - Estimated parameters
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-10-02'
    estimated_parameter:
      description: 'estimated; SVITZER named as provider, no published tariff; default 60,000 SEK per tug-assist, tug-count defaults by LOA class'
      severity: info
  # ==========================================================================
  # SJÖFARTSVERKET NATIONAL FEES (Swedish Maritime Administration)
  # All based on Net Tonnage (NT); Norrköping silo transcription of the national rules (the port-silo discipline: every port file carries its own rules with its own citations).
  # ==========================================================================

  - id: pon_sfv_vessel_fee_class1_csi_a
