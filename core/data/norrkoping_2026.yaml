# Port of Norrköping 2026 Tariff (Version 2)
# Complete data file for Port Call Cost Analyzer - self-contained port silo
# (spec: each port file is independently verifiable with zero references to any
# other port file; the engine and fee-family vocabulary are the only shared assets)
#
# All amounts in SEK, ex-VAT. Authority of record:
# docs/sources/sweden/norrkoping/NORRKOPING_EXTRACTION_REFERENCE.md;
# tariff PDF archived at
# docs/sources/sweden/norrkoping/tariff-2026-v2.pdf
# (SHA-256 7113c7959104f002f8fc5aa7f4f95dc892aee8391ce79bbca2e4acd33657af72,
# fetched 2026-10-02; the tariff's own reservation clause - the right to amend
# at any time, latest version at www.portofnorrkoping.se - makes the checksum
# the vintage pin).
#
# Not modeled (reference section 9, surfaced as notices, never estimated):
# sludge fee (announced, no published figure in the document);
# linemen / Frakt & Trosstjänst (outsourced, named, no published rate);
# rail infrastructure fee (rail-leg only, no model input);
# land-side lifts - truck/train/gate (outside the vessel-call scope);
# overtime/cancellation labour charges (not per-call container costs).

metadata:
  id: norrkoping
  name: Port of Norrköping
  country: Sweden
  currency: SEK
  validity_start: '2026-01-01'
  validity_end: '2026-12-31'
  description: 'Norrköpings Hamn AB (556007-2679) acts as port authority and terminal operator (integrated, the Helsingborg structure); Sjöfartsverket levies national fairway and pilotage fees; towage (SVITZER) and linemen (Frakt & Trosstjänst) are outsourced. Sources: Tariff 2026 Version 2 (S1), Sjöfartsverket prislista 2026 (national rules).'
  document_url: https://www.norrkopingshamn.se/wp-content/uploads/Tariff-2026-v2.pdf

billers:
  - id: port_of_norrkoping
    name: Port of Norrköping
    description: 'Norrköpings Hamn AB: port dues, PSF, waste, demurrage, cargo dues, container handling, storage, ancillaries (integrated authority-plus-operator biller)'
    currency: SEK
  - id: sjofartsverket
    name: Sjöfartsverket
    description: 'Swedish Maritime Administration: national vessel fee (fartygsavgift), readiness fee (beredskapsavgift), cargo fee (godsavgift), pilotage (lotsavgift), ordering fee'
    currency: SEK
    frequency_discount:
      id: norrkoping_sfv_frequency_discount
      name: Frequency Discount - Vessel Fee and Readiness Fee
      fee_family: frequency_discount
      apply_families: [vessel_fee, readiness_fee]
      bands:
        - min_calls: 1
          max_calls: 2
          payable_pct: 100
        - min_calls: 3
          max_calls: 3
          payable_pct: 75
        - min_calls: 4
          max_calls: 4
          payable_pct: 50
        - min_calls: 5
          max_calls: 5
          payable_pct: 25
        - min_calls: 6
          max_calls: null
          payable_pct: 0
      source_reference:
        document_name: prislista-farleds-lotsavgifter-2026.pdf
        document_url: docs/sources/sweden/national/sjofartsverket/prislista-farleds-lotsavgifter-2026.pdf
        upstream_url: "https://www-n.sjofartsverket.se/globalassets/tjanster/anlopstjanster/sjofartsverkets-farleds--och-lotsavgifter/prislista-farleds--och-lotsavgifter-2026.pdf"
        page: 4
        clause: Frequency discount
        verified_on: '2026-10-02'
        verified_by: vibe-session-swedish-expansion
        document_issued: '2025-11-01'
  - id: towage_provider
    name: Towage operator (estimated)
    description: 'SVITZER (svitzer.com) named as the outsourced tug provider in the tariff; no published rate - estimated parameter'
    currency: SEK
  - id: linemen_provider
    name: Frakt & Trosstjänst (linemen)
    description: 'Linemen service outsourced by the tariff (frakotross.se); no published rate - service gap notice'
    currency: SEK

fee_rules:
  # --- Port dues for vessels (S1 p.7) ---
  - id: pon_port_dues_standard
    fee_family: port_dues
    biller: Port of Norrköping
    name: Port Dues for Vessels (Standard Tariff)
    description: 'Port dues per GT, standard tariff 6.60 SEK/GT (the default; the liner tariff 5.70 SEK/GT applies to liner-service vessels - the tariff publishes both without a selection rule, so the standard rate is the worst-case default and the liner rate is the attestation-gated adjustment below).'
    rate_structure:
      type: per_unit
      unit_type: gt
      unit_rate: 6.60
    source_reference:
      document_name: tariff-2026-v2.pdf
      document_url: docs/sources/sweden/norrkoping/tariff-2026-v2.pdf
      page: 7
      clause: PORT DUES FOR VESSELS - STANDARD TARIFF 6,60 SEK GT
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-01-01'
    # The LINER TARIFF (5.70 SEK/GT) is recorded, not encoded as an
    # adjustment: the model''s call input surface carries no liner-service
    # attestation, and an adjustment without its input would be dead data.
    # The standard rate is the worst-case default; the liner rate is a
    # recorded finding (extraction reference section 3.1 / section 10.1).

  - id: pon_port_security_fee_vessels
    fee_family: security
    biller: Port of Norrköping
    name: Port Security Fee (Vessels)
    description: 'Port Security Fee (PSF) for vessels: 0.10 SEK/GT, "In addition to" the port dues.'
    rate_structure:
      type: per_unit
      unit_type: gt
      unit_rate: 0.10
    source_reference:
      document_name: tariff-2026-v2.pdf
      document_url: docs/sources/sweden/norrkoping/tariff-2026-v2.pdf
      page: 7
      clause: PORT DUES FOR VESSELS - PSF 0,10 SEK GT (cargo vessels)
      verified_on: '2026-10-02'
      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-01-01'

  - id: pon_waste_dry_cargo
    fee_family: waste
    biller: Port of Norrköping
    name: Ship-Generated Waste (Dry Cargo Vessels)
    description: 'Waste charge for vessels calling the Port''s operated quays, dry cargo vessels: 0.80 SEK/GT. The tariff announces a sludge fee under this section but publishes no figure in the document - the sludge surface is a gap notice, never an invented rate.'
    rate_structure:
      type: per_unit
      unit_type: gt
      unit_rate: 0.80
    source_reference:
