      verified_by: vibe-session-swedish-expansion
      document_issued: '2026-01-01'

  - id: pon_demurrage
    fee_family: port_dues
    biller: Port of Norrköping
    name: Demurrage (Idle Vessels)
    description: 'Demurrage 3.00 SEK/GT/day; the Port Authority holds the right to charge it two hours after laytime is over for vessels not sailing per the Port Captain''s instructions. Priced from the shared lay-up/idle-days input (default 0 - the default call prices no idle stay; a user-entered day count prices it, never a seeded one).'
