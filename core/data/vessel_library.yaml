# Vessel Library — curated named-vessel table (spec section 3.1 / 3.4)
# Versioned static data, consumed like tariff data: YAML authored, JSON at build.
# No runtime API calls; public fleet registries are consulted at data-entry time.
# Every entry carries a source_note for provenance.
#
# Schema:
#   name:            vessel name (display + match key)
#   imo:             IMO number (match key)
#   vessel_type:     e.g. container, tanker
#   flag:            flag state (display)
#   built:           build year
#   engine_tier:     certified NOx Tier of the most polluting engine per the
#                    IAPP certificate supplement (optional; a stored tier lets
#                    library-selected vessels compute at Hamburg without the
#                    worst-case Tier 0 default flag, spec v0.2.29)
#   gt:              gross tonnage
#   nt:              net tonnage (drives Sjöfartsverket fee classes; estimated
#                    entries are flagged, see estimated_fields and source_note)
#   loa_m:           length overall in meters
#   beam_m:          beam in meters
#   draught_m:       draught in meters
#   teu_capacity:    container capacity in TEU
#   class_note:      free-text size-class note
#   estimated_fields: list of fields whose values are estimates rather than
#                    registry-confirmed data (drives the form's "est." badge)
#   nt_observation_records: documented aggregator observations of the NT
#                    particular (spec v0.3.3, item 4) - each carries the
#                    observed value, the source, the fetch date, and the
#                    evidentiary status (observation-not-confirmation); a
#                    registry confirmation remains the only closing evidence.
#                    Surfaced at the NT-class indication so the class
#                    assignment carries its own provenance - flagged, never
#                    presented as registry-confirmed.
#   source_note:     provenance — where the particulars were verified

vessels:
  - name: HELGAFELL
    imo: "9306017"
    vessel_type: container
    flag: Faroe Islands
    built: 2005
    gt: 8890
    nt: 3783
    loa_m: 137.5
    beam_m: 22
    draught_m: 8.51
    teu_capacity: 909
    class_note: "Geared feeder (Samskip Iceland service; North Atlantic / North Europe feeder routes)"
    estimated_fields: [nt]
    nt_observed: true
    source_note: "Particulars cross-checked via VesselFinder (IMO 9306017) and Flexport Atlas vessel registry, 2026-09-21. LOA 137.5 m per the reference record (the previous 137 m entry was a rounding defect, corrected v0.2.48). Draught confirmed via owner fleet data. NT estimated from an aggregator observation: 3,783 (Marine MAN fleet-data aggregator, IMO 9306017, fetched 2026-09-30, single source — not registry-confirmed, the estimate flag stays; no confirming second source obtained: VesselFinder renders without tonnage particulars, the DNV register and Equasis unreachable, maritime-connector unreachable per the standing rule). Fee class: Class 4 (3,000+ NT) — the observed value sits 783 above the class boundary; the former ~36-percent-of-GT estimate (3,200) is superseded by the observed particular (v0.3.0 re-derivation)."

