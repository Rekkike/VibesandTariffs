    built: 2014
    gt: 194849
    nt: 79120
    loa_m: 399
    beam_m: 60
    draught_m: 16.0
    teu_capacity: 19076
    class_note: "Ultra-large (Triple-E class, Asia-Europe)"
    estimated_fields: [nt]
    nt_observed: true
    source_note: "Particulars cross-checked via VesselFinder (IMO 9632129) and Flexport Atlas vessel registry, 2026-09-21. Draught is design draught, class-standard for Triple-E. NT estimated from an aggregator observation: 79,120 (Marine MAN fleet-data aggregator, IMO 9632129, fetched 2026-09-30, single source with a reliability caveat — the same page carries a defective TEU figure (600 for a 19,076-TEU vessel), so the observation is treated as an observed estimate, not registry confirmation; the estimate flag stays; the DNV register, Equasis, and the Danish Maritime Authority register were all unreachable for confirmation). Fee class: Class 9 (60,000+ NT) — the class placement is arithmetically forced for any plausible NT (the IMO floor NT >= 0.30 x GT = 58,455 excludes Class 8; the Class 10 threshold of 100,000 exceeds the plausible band), and the former note's 'Class 7' claim was a prose error (70,000 NT was already Class 9; corrected, disclosed in the v0.3.0 audit). The observed value replaces the former 36-percent-of-GT estimate (70,000); the class does not move, so no fee moves for this vessel."

  - name: MSC KYUNGMIN
    imo: "9967005"
    vessel_type: container
    flag: LR
    built: 2024
    gt: 21979
    nt: 9654
    nt_observed: true
    loa_m: 171.92
    beam_m: 28.4
    draught_m: 9.8
    teu_capacity: 2400
    class_note: "Feeder (Fujian Mawei series; GT and TEU capacity estimated from fleet trackers, not registry-confirmed)"
    estimated_fields: [gt, teu_capacity, nt, draught_m]
    nt_observation_records:
      - observed_nt: 9654
        source: "Flexport Atlas vessel registry (aggregator)"
        fetched: "2026-10-01"
        status: "observation-not-confirmation"
        note: "An aggregator observation, not a registry confirmation. The registry routes remain automation-blocked (the DNV register blocks automated access - verified 2026-10-01; Equasis automation-blocked; the Korean register not fetchable by automated retrieval). A second aggregator now carries an NT figure where the v0.3.0 pass found none (Marine MAN carried GT but no NT for IMO 9967005); the v0.3.4 pass promoted the observed figure to the model NT (9,654), superseding the former authored default of 8,000 (unknown provenance) under the observation-quality flag - observed, never a registry confirmation; a registry confirmation remains the only closing evidence and re-opens the adjudication."
    source_note: "Particulars checked against VesselFinder and fleet-tracker data (IMO 9967005), 2026-09-23. LOA 171.92 m, beam 28.4 m, build year 2024, flag LR, and DWT 29,553 are registry-confirmed; GT (21,979) and TEU capacity (2,400) are tracker estimates — the basis stated per the v0.2.48 data-audit correction (the entry previously claimed GT as registry-confirmed). Draught estimated (typical for the Fujian Mawei 1,700-series feeder; AIS has observed 8.3 m laden). NT estimated from an aggregator observation: 9,654 — the v0.3.4 promotion; the Flexport Atlas aggregator observation (fetched 2026-10-01) corroborating the Marine MAN v0.3.0-era figure; observed, not registry-confirmed; the registry routes remain automation-blocked — the DNV register blocks automated access, verified 2026-10-01; Equasis automation-blocked; the Korean register not fetchable. The former authored default (8,000, unknown provenance) is superseded; the observation is the placement basis. Fee class: Class 5 (6,000+ NT) at both 8,000 and 9,654 — the promotion moves no class and no dues (the v0.3.4 audit). The observed estimate band (±10 percent of 9,654 = 8,689–10,619 NT, the v0.3.0 audit's placement-basis adjudication) still spans the Class 6 boundary at 10,000, so the boundary notice renders at both Swedish ports (Class 5 used; Class 6 disclosed as the alternative: vessel fee +36,630, readiness +10,935, pilotage start +6,800, +1,465 per half-hour)."
