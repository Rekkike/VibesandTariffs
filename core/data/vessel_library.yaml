# Vessel Library — curated named-vessel table (spec section 3.1 / 3.4)
# Versioned static data, consumed like tariff data: YAML authored, JSON at build.
# No runtime API calls; public fleet registries are consulted at data-entry time.
# Every entry carries a source_note for provenance.
#
# Schema:
#   name:            vessel name (display + match key)
#   imo:             IMO number (match key)
#   vessel_type:     e.g. container, tanker
#   flag:            flag state (display)
#   built:           build year
#   engine_tier:     certified NOx Tier of the most polluting engine per the
#                    IAPP certificate supplement (optional; a stored tier lets
#                    library-selected vessels compute at Hamburg without the
#                    worst-case Tier 0 default flag, spec v0.2.29)
#   gt:              gross tonnage
#   nt:              net tonnage (drives Sjöfartsverket fee classes; estimated
#                    entries are flagged, see estimated_fields and source_note)
#   loa_m:           length overall in meters
#   beam_m:          beam in meters
#   draught_m:       draught in meters
#   teu_capacity:    container capacity in TEU
#   class_note:      free-text size-class note
#   estimated_fields: list of fields whose values are estimates rather than
#                    registry-confirmed data (drives the form's "est." badge)
#   source_note:     provenance — where the particulars were verified

