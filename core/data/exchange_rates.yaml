# Exchange-rate reference data for the cross-currency comparison view
# (spec v0.2.31, commit A; published-pairs structure at v0.3.2).
#
# The comparison basis is SEK: the Swedish ports bill in SEK and Hamburg in
# EUR, so the single conversion needed is EUR->SEK. The pinned default is
# static, versioned data: the pinned rates below are the values of record,
# currently the 2026-11-10 ECB observation, and they move only in dedicated
# rate passes, never mid-pass. The comparison view renders the pinned rate
# beside every converted figure; display conversions are presentation-only.
# The rate-refresh button (v0.3.2) was removed at v0.4.0. The manual
# override input remains: it is a user-side display adjustment at the UI
# layer only and never writes this file; the pinned default below remains
# the model's rate in every default rendering.
#
# Published-pairs structure (v0.3.2): each entry is one published,
# EUR-anchored pair — a rate actually published by the ECB, never a
# derived cross. Adding a future pair (DKK at Aarhus, PLN at Gdynia) is a
# data-only addition: one more entry below, no code change. The settled
# design for those expansions, documented here and deliberately NOT
# implemented: a Danish/Polish port bills in DKK/PLN; the ECB publishes
# EUR->DKK and EUR->PLN; a DKK->SEK or PLN->SEK conversion would be a
# derived cross (SEK per DKK = (EUR->SEK) / (EUR->DKK)). Those crosses
# activate at the Aarhus/Gdynia expansion pass, not now — no speculative
# pair is populated in this file, and no derived-cross code exists.
#   (Superseded in place at v0.11.5, Docs alignment (user rulings 2026-10-22):
#   the two paragraphs above are the v0.3.2 record. Since v0.6.0 the
#   comparison also converts DKK: the Aarhus expansion populated the
#   EUR->DKK published pair below, and the derived cross SEK per DKK =
#   (EUR->SEK) / (EUR->DKK) is implemented in web/src/conversion.ts. The
#   PLN pair at Gdynia remains unpopulated.)
#
# Sources: the ECB euro foreign-exchange reference rates,
# mirrored by the Frankfurter API (https://api.frankfurter.app).
# The ECB publishes reference rates on TARGET business days only; the
# as_of date below is the publication date of the recorded rate.
#
# Standing verification ritual (effective v0.3.2, permanent; extended to
# BOTH published pairs at v0.6.0; restated v0.7.1): every pass observes the
# EUR->SEK and EUR->DKK rates against the latest TARGET-business-day
# publication and records any drift. Observation is continuous; the pinned
# rates and as_of below move only in a dedicated rate pass, never mid-pass.
# Each pair's drift is declared independently.
#   Previous pin (v0.3.2 ritual, verified 2026-10-01): 11.331 as of 2026-09-30.
#   Previous pin (v0.4.6 ritual, verified 2026-10-02): 11.29 as of 2026-10-02.
#   Previous pin (v0.5.2 ritual, verified 2026-10-05): 11.2525 as of 2026-10-05.
#   Previous pin (v0.6.0 ritual, verified 2026-10-06): 11.2525 as of 2026-10-05.
#   https://api.frankfurter.app/latest?from=EUR&to=SEK,DKK
#   Previous observed (v0.6.0 ritual, verified 2026-10-06):
#   { "base": "EUR", "date": "2026-10-05", "rates": { "DKK": 7.4745, "SEK": 11.2525 } }
#   Previous pin (v0.6.6 ritual, verified 2026-10-07):
#   { "base": "EUR", "date": "2026-10-07", "rates": { "DKK": 7.4745, "SEK": 11.224 } }
#   Previous pin (v0.8.1 ritual, verified 2026-10-20):
#   { "base": "EUR", "date": "2026-10-20", "rates": { "DKK": 7.4746, "SEK": 11.123 } }
#   SEK drift declared: 11.224 -> 11.123, as_of 2026-10-07 -> 2026-10-20;
#   DKK drift declared: 7.4745 -> 7.4746, as_of 2026-10-07 -> 2026-10-20
#   (the ECB TARGET publication of 2026-10-20, observed at execution; read
#   from the ECB daily XML and cross-checked against the mirror above).
#   Current  pin (v0.13.0 ritual, ECB rate pass (user rulings 2026-11-11),
#   verified 2026-11-11): the ECB TARGET publication of 2026-11-10, read
#   from the ECB daily XML (www.ecb.europa.eu/stats/eurofxref/
#   eurofxref-daily.xml): Cube time='2026-11-10', SEK rate='10.9910',
#   DKK rate='7.4754'. Cross-checked against the mirror, which now serves
#   from https://api.frankfurter.dev/v1/latest?from=EUR&to=SEK,DKK (the
#   address above redirects there):
#   { "base": "EUR", "date": "2026-11-10", "rates": { "DKK": 7.4754, "SEK": 10.991 } }
#   The published four-decimal SEK rate is 10.9910; the mirror and the
#   parsed value below drop the trailing zero (10.991), the same number.
#   SEK drift declared: 11.123 -> 10.9910 (-0.1320), as_of 2026-10-20 -> 2026-11-10;
#   DKK drift declared: 7.4746 -> 7.4754 (+0.0008), as_of 2026-10-20 -> 2026-11-10.
published_pairs:
  - pair: EUR-SEK
    from_currency: EUR
    to_currency: SEK
    rate: 10.9910
    as_of: 2026-11-10
    source: ECB euro reference rate (SEK per EUR)
  - pair: EUR-DKK
    from_currency: EUR
    to_currency: DKK
    rate: 7.4754
    as_of: 2026-11-10
    source: ECB euro reference rate (DKK per EUR)
