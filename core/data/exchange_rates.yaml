# Exchange-rate reference data for the cross-currency comparison view
# (spec v0.2.31, commit A; published-pairs structure at v0.3.2).
#
# The comparison basis is SEK: the Swedish ports bill in SEK and Hamburg in
# EUR, so the single conversion needed is EUR->SEK. The pinned default is
# static, versioned data. The comparison view renders it beside every
# converted figure, the user may override it at the UI, and the
# rate-refresh button (v0.3.2) fetches the latest published rate on demand
# — a fetched value is an override at the UI layer only; the pinned default
# below remains the model's rate in every default rendering.
#
# Published-pairs structure (v0.3.2): each entry is one published,
# EUR-anchored pair — a rate actually published by the ECB, never a
# derived cross. Adding a future pair (DKK at Aarhus, PLN at Gdynia) is a
# data-only addition: one more entry below, no code change. The settled
# design for those expansions, documented here and deliberately NOT
# implemented: a Danish/Polish port bills in DKK/PLN; the ECB publishes
# EUR->DKK and EUR->PLN; a DKK->SEK or PLN->SEK conversion would be a
# derived cross (SEK per DKK = (EUR->SEK) / (EUR->DKK)). Those crosses
# activate at the Aarhus/Gdynia expansion pass, not now — no speculative
# pair is populated in this file, and no derived-cross code exists.
#
# Sources: the ECB euro foreign-exchange reference rates,
# mirrored by the Frankfurter API (https://api.frankfurter.app).
# The ECB publishes reference rates on TARGET business days only; the
# as_of date below is the publication date of the recorded rate.
#
# Standing verification ritual (effective v0.3.2, permanent; extended to
# BOTH published pairs at v0.6.0): every pass re-verifies the EUR->SEK and
# EUR->DKK rates against the latest TARGET-business-day publication and
# updates the rates and as_of below. Each pair's drift is declared
# independently.
#   Previous pin (v0.3.2 ritual, verified 2026-10-01): 11.331 as of 2026-09-30.
#   Previous pin (v0.4.6 ritual, verified 2026-10-02): 11.29 as of 2026-10-02.
#   Previous pin (v0.5.2 ritual, verified 2026-10-05): 11.2525 as of 2026-10-05.
#   Previous pin (v0.6.0 ritual, verified 2026-10-06): 11.2525 as of 2026-10-05.
#   https://api.frankfurter.app/latest?from=EUR&to=SEK,DKK
#   Previous observed (v0.6.0 ritual, verified 2026-10-06):
#   { "base": "EUR", "date": "2026-10-05", "rates": { "DKK": 7.4745, "SEK": 11.2525 } }
#   Current  pin (v0.6.6 ritual, verified 2026-10-07):
#   { "base": "EUR", "date": "2026-10-07", "rates": { "DKK": 7.4745, "SEK": 11.224 } }
#   SEK drift declared: 11.2525 -> 11.224, as_of 2026-10-05 -> 2026-10-07;
#   DKK drift 0 (7.4745, the same publication's DKK figure; the pair's
#   as_of moves with the observed publication date).
published_pairs:
  - pair: EUR-SEK
    from_currency: EUR
    to_currency: SEK
    rate: 11.224
    as_of: 2026-10-07
    source: ECB euro reference rate (SEK per EUR)
  - pair: EUR-DKK
    from_currency: EUR
    to_currency: DKK
    rate: 7.4745
    as_of: 2026-10-07
    source: ECB euro reference rate (DKK per EUR)
