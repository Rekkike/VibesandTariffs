name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      # Install core dependencies and convert YAML to JSON
      - name: Install core and convert YAML to JSON
        run: cd core && npm install && node scripts/convert_yaml_to_json.js
      
      # Build core module
      - name: Build core
        run: cd core && npm run build
      
      # Install web dependencies
      - name: Install web dependencies
        run: cd web && npm install
      
      # Build web app
      - name: Build web app
        run: cd web && CI=false npm run build
      
      - uses: actions/configure-pages@v5
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
