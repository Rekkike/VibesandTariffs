name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      # Install and build core module
      - name: Install and build core
        run: cd core && npm install && npm run build
      
      # Copy canonical data to web for CRA build
      - name: Copy canonical data to web
        run: mkdir -p web/src/data && cp core/data/gothenburg_2026.yaml web/src/data/gothenburg_2026.yaml
      
      # Install web dependencies
      - name: Install web dependencies
        run: cd web && npm install
      
      # Build web app
      - name: Build web app
        run: cd web && npm run build
      
      - uses: actions/configure-pages@v5
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build
      
      - uses: actions/deploy-pages@v4
