name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      # Copy canonical data to web BEFORE building
      - name: Copy canonical data to web
        run: mkdir -p web/src/data && cp core/data/gothenburg_2026.yaml web/src/data/gothenburg_2026.yaml
      
      # Install and build core module
      - name: Install and build core
        run: cd core && npm install && npm run build
      
      # Install web dependencies
      - name: Install web dependencies
        run: cd web && npm install
      
      # Build web app
      - name: Build web app
        run: cd web && CI=false npm run build
      
      - uses: actions/configure-pages@v5
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
