name: Tests

# Runs the core and web suites on every push to main and once a week
# (spec v0.12.3, user rulings 2026-11-11). The weekly run makes a
# date-dependent failure visible without a push. This workflow reports only:
# it is not a required check and gates nothing.
on:
  push:
    branches: [ main ]
  schedule:
    # Mondays 05:17 UTC
    - cron: '17 5 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 since v0.15.1: the vite 8 / vitest 5 line requires >= 22.12
          node-version: 22

      - name: Install core and convert YAML to JSON
        run: cd core && npm ci && node scripts/convert_yaml_to_json.js

      - name: Build core
        run: cd core && npm run build

      # Core typecheck gate (spec v0.16.0): test-inclusive tsconfig with
      # vitest/globals types, restored when ts-jest left with jest 29.
      - name: Core typecheck
        run: cd core && npm run test:types

      # Core tests run under Vitest since v0.16.0 (web/ runs Vitest since
      # v0.15.0): npm test in core/ is `vitest run`, already a single run;
      # fileParallelism:false in core/vitest.config.ts is the --runInBand
      # equivalent.
      - name: Core tests
        run: cd core && npm test

      - name: Install web dependencies
        run: cd web && npm ci

      # Web tests run under Vitest since v0.15.0 (spec section 12.4,
      # superseded in place there): web/ npm test is `vitest run`, already a
      # single run; fileParallelism:false in web/vitest.config.ts is the
      # --runInBand equivalent.
      - name: Web tests
        run: cd web && npm test
